    ["#b5a386", "", 3], ["#5b4333", "", 2],
    ["#3c5a46", "", 1], ["#d8b23a", "", 0.5], ["#c9d3cf", "", 1.5]]
# Shenzhen taxis: blue-and-white BYD e6 (most), red, green (outside the old city)
taxi = [["#2f86c9", "#f0f0ec", 62], ["#b8262b", "#b8262b", 26], ["#3a9a58", "#eeeeea", 12]]
van = [["#ecedec", "", 45], ["#a9adb1", "", 15], ["#6a6e72", "", 8], ["#141518", "", 8],
    ["#274a80", "", 6], ["#c21d24", "#ecedec", 5],     # JD Logistics red and white
    ["#1b1b1b", "#ecedec", 5], ["#d9d4c5", "", 8]]      # SF Express black and white
