[project]
name = "city3d"
version = "0.1.0"
description = "build-3d-city data pipeline: a config-driven engine turning open data into a three.js city (city.toml per city)"
requires-python = ">=3.12"
dependencies = [
    "geopandas>=1.0",
    "pyogrio",
    "shapely>=2.0",
    "pyproj",
    "numpy",
    "pandas",
    "requests",
    "matplotlib",
    "folium",
    "ijson",
    "rasterio",
    "rasterstats",
    "trimesh",
    "mapbox-earcut",
    "remotezip",
    "meshoptimizer>=0.2.30a0",
    "scipy>=1.18.1",
    "duckdb",
]

[project.scripts]
city3d = "city3d.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/city3d"]
