margin = 3000.0             # mostly sea to the south and east
town = true                 # beyond the 500 m band of masses: a painted roofscape (New York's)
# 500 m of block masses on the land side only (north, west and east of the centre), none on the sea sides: the band
# polygon (10.8 km², 4 polygons) is data/masses_within.geojson, made by scripts/m1_masses_band.py (the districts + 500 m,
# less the districts, less the sea by OSM's coastline). `masses_within` (opt-in, merged 6 Oct) keeps only the masses
# whose footprint lies in it and fetches OSM only over the chunks touching it; the band lies inside the 3 km ground
# area (until M7, masses_reach 0; see below for Johor Bahru)
masses = true
masses_within = "data/masses_within_m7.geojson"
# M7 (engine opt-ins): Johor Bahru's towers across the strait (OSM: 300 over 30 m, 85 over 80 m) as masses, the clip's
# second polygon (north of the Causeway, data/masses_within_m7.geojson = the band + it), 15-17 km beyond the ground
# area: the reach takes them in, masses_thin = false stands every mass in the clip at its height (no thinning towards
# the reach), cover_inner_reach = 0 keeps the inner cover map where it was. Batam's not: the local Overpass extract has
# no Indonesia
masses_reach = 18000.0
masses_thin = false
# M7 (engine opt-in; before: beyond the band the heartlands were a flat painted plain to the horizon, North to Johor):
# over the whole island (data/masses_tall_m7.geojson, a box to the strait) the towers of 30 m and more stand as masses
# too, the HDB towns' 12-40 storey blocks to the horizon (their low-rise stays the painted roofscape)
masses_tall_within = { file = "data/masses_tall_m7.geojson", min_h = 30.0 }
# M5: the container terminals (Keppel, Brani, Tanjong Pagar, Pasir Panjang: OSM industrial=port) as paved yards on the
# aeroway layer (concrete panels, no lots, scrub or trees), not the land's beige patchwork (engine opt-in)
yards = ["industrial=port"]
# 7 Oct (the user: Gardens by the Bay's Meadow car park drawn on the lawn): surface car parks inside a park's green are cut
# out of it and drawn on the asphalt layer (engine opt-in; w171981662, The Meadow Carpark, open-air, 284 bays)
lots_off_green = "all"       # M7 (critic: the Bayfront Plaza lot w1121873001 on WorldCover's lawn): every surface lot paved
# M5 fix round 1 (critic: the Padang a pale concrete plaza; Bay East and Marina South pale lots with grey patches). The
# Padang (w21587770) is leisure=pitch with no surface tag, which [ground.green] doesn't fetch, so it fell to the land's
# urban lots (and 08_trees's open class sprinkled trees on it): drawn as green by id (engine opt-in green_ids), its trees
# gone with every pitch's ([trees] none_extra). Grass pitches (school fields) green by tag. The vacant reclaimed land of
# Marina East and Marina South, OSM landuse=construction with no project (Bay East Garden w884118657, Marina East
# w23946435 and w884097568, Marina South w1080278288 and w958871593), grassed in the aerials: green by id. The named
# building sites (condos, NS Square, Therme) stay lots
green_tags = ["leisure=pitch;surface=grass"]
# M7 (critic 2: Marina South still pale polygonal blotches in front of the CBD): the two unnamed construction lots west of
# Bayfront Plaza (w1229470020, w1415502532), grassed in the aerials, green by id too
green_ids = ["way/21587770", "way/884118657", "way/23946435", "way/884097568", "way/1080278288", "way/958871593",
    "way/1229470020", "way/1415502532"]

[roads]
margin = 1000.0
# footways on bridges drawn (off by default): the Helix Bridge, the Jubilee and Alkaff bridges, the Sentosa Boardwalk
# and the river's footbridges are highway=footway; pavements along road bridges stay out
footbridges = true

[trees]
urban_margin = 1000.0
# M3 fix round (critic: trees standing on Brani's container yards): no invented trees on the port terminals (Keppel,
# Brani, Tanjong Pagar: landuse=industrial) or port land
none_extra = ["landuse=industrial", "landuse=port", "leisure=pitch", "leisure=track"]
# M6: street trees after NParks' roadside planting: rain trees, angsana and tembusu (the viewer's broadleaf slots, dressed
# in web/city.json trees.species), yellow flame and trumpet trees on some streets, palms on a few boulevards (Sentosa,
# Marina Bay, Raffles Avenue); heights 12-18 m on the arterials (Singapore's mature roadside trees), 9-14 on small roads
# M6 fix round 1 (critic: flowering trees overused, ~20-30 %): ~5 % of street trees flowering (whole roads, as planted)
[trees.street.odds]
major = [["palm", 0.08], ["flowering", 0.14]]
minor = [["palm", 0.04], ["flowering", 0.09]]
[trees.street.height]
palm = [10, 15]
flowering = [8, 12]
broadleaf = {major = [12, 18], minor = [9, 14]}
# M6 (engine opt-in): Orchard Road's and Nicoll Highway's rain-tree avenues: the kerb row of rain trees (the first
# broadleaf slot) 15-19 m every 13 m, and a lower second row (0.6 of the height) along the pavement's far side: the
# "double canopy" over the pavements, the carriageway left open to the sky
[trees.street.named]
"Orchard Road" = { species = "broadleaf", height = [15.0, 19.0], step = 13.0, rows = [2.6, [9.0, 0.6]], first = true }
"Nicoll Highway" = { species = "broadleaf", height = [15.0, 19.0], step = 13.0, rows = [2.6, [8.5, 0.6]], first = true }
"Orchard Boulevard" = { species = "broadleaf", height = [16.0, 20.0], step = 12.0, rows = [2.6], first = true }
"Scotts Road" = { species = "broadleaf", height = [16.0, 20.0], step = 12.0, rows = [2.6], first = true }
"Stamford Road" = { species = "broadleaf", height = [16.0, 20.0], step = 12.0, rows = [2.6], first = true }
"Raffles Avenue" = { species = "palm", height = [11.0, 14.0], step = 10.0, rows = [2.6] }

# M5: Singapore's road markings (LTA's Code of Practice, chapter 3) follow the British system: white lane and centre
# lines, double yellow lines along the kerbs of the main roads (no parking at any time), signalled junctions with stop
# lines and two broken lines for the pedestrian crossing, zebras with white zig-zags and amber beacons, bus lanes
# (red-surfaced on the full-day ones) along the left kerb. The engine's UK options (London M5)
[markings]
warning = 18.0
kerb_lines = { trunk = "yellow", primary = "yellow", secondary = "yellow" }
kerb_mouths = { tertiary = "yellow", residential = "yellow", unclassified = "yellow" }
bus_lanes = true
bus_red = 0.6
junctions = "signals"
zebras = true
zigzag = 16.0
signal_crossings = true

