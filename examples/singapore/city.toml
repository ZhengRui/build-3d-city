# M3 critic: Sentosa's beach and lagoon sand glowed and bled 10-20 m into the water, breakwater islets read as glowing
# blobs, a groyne tip at Tanjong Beach was a pale wedge on the sea. The beach's seaward side (slope 14 m + toe 12 m, and
# twice that at a sharp tip, the miter) is fitted into 3 m and the rock revetment's (5 + 8 m) into 7 m, the shader's across
# coordinate unchanged (the same wet-sand ramp and swash line, squeezed; the sand stays 16 m on the land side); a closed
# coast loop under 120 m across (the beach islets off Siloso and Tanjong; Palawan's 172 m one keeps its beach) gets no sand strip, only revetment. Opt-in engine settings (05e_shores)
water_side = { beach = 3.0, revetment = 7.0 }
islet_max = 120.0
islet_type = "revetment"

[terrain]
# M7: 30 km (was 15): Johor Bahru's shore and hills to the north (15 km had its edge just behind the city), Batam's
