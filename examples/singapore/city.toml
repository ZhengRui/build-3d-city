# meet the water): Marina Bay (OSM's Marina Reservoir) and other lakes over 0.5 km² take the stone edge (granite coping, a
# short stone face) all round, beside lawns too (engine opt-in); the park ponds keep soft banks, their boulders smaller
# and greyer in web/city.json shores.pondBank
