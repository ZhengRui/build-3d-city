# M3: the Shenzhen recipe (buildings masked and opened, canopy off, smoothed, the sea knee) on GLO-30. Singapore's
# hills are small (Fort Canning 300 m across, Pearl's Hill 250 m): open ground smoothed at 30 m, not 45, which
# shaved Mount Faber to 86 m (106)
