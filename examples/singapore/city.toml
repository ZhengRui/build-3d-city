# Singapore: the centre and the Greater Southern Waterfront (option D, the user's choice of 6 Oct 2026; the boundary
# note the Phase 0 boundary note): Marina Bay all round, the CBD, the Civic District, the Singapore
# River, Chinatown, Bugis, Kampong Glam and Little India, Kallang Basin and the Sports Hub, Orchard Road, River Valley,
# Tiong Bahru, the City Terminals port, HarbourFront, Keppel Bay, Mount Faber and Sentosa. Every city-specific setting
# of the build-3d-city pipeline; the engine (.agents/skills/build-3d-city/engine/pipeline, its README lists every key
# with its default) and the region preset "china-south" hold the rest. Run a stage with `uv run city3d <stage>` from
# this folder, everything with `uv run city3d all`.

# M4 landmark figures written by scripts/m4l_structures.py (engine README, "Generated settings")
include = ["generated/structures-m4l.toml"]

name = "singapore"
title = "Singapore"
# Singapore's own (M4): "sg-singapore", built on china-south (Shenzhen's: the nearest tower city, a subtropical coast with
# mangroves and palms), whose tables it keeps but for the facade styles: HDB blocks with void decks, corridors and accent
# paint, shophouses with five-foot ways and tile roofs, granite and colonial civic, condos, Sentosa villas ([facade.singapore])
preset = "sg-singapore"
# UTM 48N (central meridian 105 E; Singapore at 103.85 E: scale 0.99982). The official data is SVY21 (EPSG:3414,
# a transverse Mercator on WGS 84): read in its own CRS by every adapter and warped as it loads
utm_epsg = 32648
coast = true                # the Singapore Strait, Keppel Harbour and the Marina Bay reservoir behind its barrage
drive = "left"              # left-hand traffic: lanes, parking, medians and stop lines mirrored
# metres per storey for OSM building:levels (M2): where OSM has both a height and levels, the median height per storey
# is 3.4 (13-20 storeys, n 43), 3.8 (21-30, n 42) and 3.9 (31+, n 51); under 13 storeys the tags are mostly an
# import's round heights (10 m on 2 and 3 storeys: 5.0 and 3.33 a storey), and Singapore's shophouses are ~4 m a
# storey. 3.5: condos (3.2-3.4 + roof) and offices (4.0-4.2) between. HDB blocks have their own rule ([sources.hdb])
level_h = 3.5
user_agent = "city3d (you@example.com)"
# The local Overpass first (Singapore's, port 8785; started by the user, from the Geofabrik Malaysia-Singapore-Brunei
# extract), then the public mirrors Berlin lists. Connection refused falls through to the mirrors; 01_osm is run with
# --overpass-cache ../data/singapore/raw/overpass so every answer is kept and replayed
overpass = ["http://127.0.0.1:8785/api/interpreter", "https://maps.mail.ru/osm/tools/overpass/api/interpreter",
    "https://overpass-api.de/api/interpreter", "https://overpass.kumi.systems/api/interpreter",
    "https://overpass.private.coffee/api/interpreter"]

[osm]
# by each district polygon's box, not Overpass area(): a fresh local Overpass may have no area data (Berlin's), and
# the answer is the same set of buildings
area = false
# M2 fix round 2 (engine opt-ins of 6 Oct): underground=yes, location=underground|indoor and level < 0 outlines go
# (HarbourFront MRT's box: underground=yes on layer=1; an indoor workshop)
underground_drop = true
# M3 fix round: "decks" (engine opt-in): raised decks such as the MBS SkyPark (193-207 m over the three
# 198 m towers) and Canninghill Piers' skybridge (80.5-84 m) are kept in the air without the dedupe dropping the towers
# under them. (Plain min_height had dropped MBS's towers and floated towers over podium rings.) Tanjong Rhu's Sky Deck
# stays out by id
min_height = "decks"

# The user's boundary (6 Oct 2026, option D): URA Master Plan 2019 subzones (raw/MP2019_subzone_nosea.geojson,
# Singapore Open Data Licence), 54 of them in 14 planning areas. URA's units are not OSM relations by URA's names
# (OSM's level 6/7 copies, r19910xxx, differ in places), so every district is the country relation (Singapore,
# r536780, which reaches into the territorial sea and so holds every subzone) clipped to the union of the chosen
# subzones of one planning area: the clips ARE the subzone lines (simplified as a coverage by 5 m, shared edges kept),
# read from data/boundary_districts.geojson by each district's name (its properties.name), which scripts/m1_boundary.py
# writes (coordinates to 6 decimals). Maritime Square only east of 103.8085 E; Southern Islands only its Sentosa
# subzone (four beach islets under 5 ha left out: 3.0 ha, no buildings); Kallang's Crawford is apart from Tanjong
# Rhu, so a district of its own. 32.55 km² in all, of which 2.72 km² inland water (Marina Bay and Reservoir, Kallang
# Basin, the river, Keppel channel): 29.82 km² land.
# Underground: OSM's location=underground / layer<0 outlines (MRT stations, the Marina Bay Link Mall, the CityLink
# and Esplanade Xchange malls) are dropped in M2 (common.load_osm does it by default; check them in checks/buildings.md)
[districts]
# City Terminals, Everton Park, Maritime Square, Singapore General Hospital, Telok Blangah Rise, Tiong Bahru; 7.55 km², 332 vertices
"Bukit Merah (Tiong Bahru to the City Terminals)" = { relation = 536780, clip = "data/boundary_districts.geojson" }
# Anson, Bayfront Subzone, Bugis, Cecil, Central Subzone, City Hall, Clifford Pier, Marina Centre, Maxwell, Nicoll, Phillip, Raffles Place, Tanjong Pagar; 5.08 km², 188 vertices
"Downtown Core" = { relation = 536780, clip = "data/boundary_districts.geojson" }
# Tanjong Rhu; 2.44 km², 71 vertices
"Kallang (Tanjong Rhu)" = { relation = 536780, clip = "data/boundary_districts.geojson" }
# Crawford; 0.24 km², 29 vertices
"Kallang (Crawford)" = { relation = 536780, clip = "data/boundary_districts.geojson" }
# Marina East; 1.84 km², 75 vertices
"Marina East" = { relation = 536780, clip = "data/boundary_districts.geojson" }
# Marina South; 1.63 km², 55 vertices
"Marina South" = { relation = 536780, clip = "data/boundary_districts.geojson" }
# Bras Basah, Dhoby Ghaut, Fort Canning; 0.83 km², 83 vertices
"Museum" = { relation = 536780, clip = "data/boundary_districts.geojson" }
# Istana Negara; 0.54 km², 66 vertices
"Newton (Istana Negara)" = { relation = 536780, clip = "data/boundary_districts.geojson" }
# Boulevard, Somerset, Tanglin; 0.96 km², 150 vertices
"Orchard" = { relation = 536780, clip = "data/boundary_districts.geojson" }
# China Square, Chinatown, Pearl's Hill, People's Park; 1.37 km², 106 vertices
"Outram" = { relation = 536780, clip = "data/boundary_districts.geojson" }
# Institution Hill, Leonie Hill, One Tree Hill, Oxley, Paterson; 1.48 km², 127 vertices
"River Valley" = { relation = 536780, clip = "data/boundary_districts.geojson" }
# Bencoolen, Farrer Park, Kampong Glam, Little India, Mackenzie, Mount Emily, Rochor Canal, Selegie, Sungei Road, Victoria; 1.59 km², 126 vertices
"Rochor" = { relation = 536780, clip = "data/boundary_districts.geojson" }
# Boat Quay, Clarke Quay, Robertson Quay; 0.96 km², 118 vertices
"Singapore River" = { relation = 536780, clip = "data/boundary_districts.geojson" }
# Sentosa; 4.92 km², 542 vertices
"Sentosa" = { relation = 536780, clip = "data/boundary_districts.geojson" }
# Straits View; 1.13 km², 38 vertices
"Straits View" = { relation = 536780, clip = "data/boundary_districts.geojson" }

[sun]                       # the viewer's sun: late March, the dry north-east monsoon's end, the noon sun near the zenith
latitude = 1.29
declination = 1.0

[sources]
# M2: OSM is the footprint source (complete and current in the centre); HDB's blocks fill where OSM has none (6
# small blocks, and the HDB complexes whose OSM outline is the whole podium: [buildings] exclude) and give every
# footprint they cover their storeys, before OSM's tags (OSM's HDB heights are mappers' 3.0-3.4 m x storeys, and a
# complex's outline carries its towers' height: Waterloo Centre 55 m on 7,900 m²). "est": OSM buildings with no
# height and no levels take the median of their tagged neighbours of a similar footprint (scripts/m2_heights.py,
# checks/m2_estimates.md), before the default of 3 storeys. URA's MP2019 layer is not a footprint layer (4 % of OSM
# matched; checks/m1_sources.md): unused
footprints = ["osm", "hdb", "est"]
# est before osm_levels: it carries the shophouse rule (1-4 levels: 4.5 m + 4 m a storey); else only untagged ones
heights = ["landmark", "hdb", "osm_height", "est", "osm_levels", "default"]
dem = "copernicus"          # GLO-30: the only open DEM (no open LiDAR; OneMap3D is a viewer only). A surface model
[sources.copernicus]
# the ground area (3 km) and the backdrop (15 km) reach 103.6-104.05 E, 1.1-1.45 N
tiles = ["N01_00_E103_00", "N01_00_E104_00"]

[sources.hdb]               # HDB Existing Building (footprints) + HDB Property Information (storeys), data.gov.sg
adapter = "file"
# HDB's block footprints in the scene's box with max_floor_lvl joined by block number and street (scripts/m1_sources.py:
# hdb_storeys.gpkg; raw/hdb_building, raw/hdb_property; Singapore Open Data Licence), towers cut out of the podiums
# they overlap and podiums carrying their towers' storeys set to 3 (scripts/m2_heights.py: hdb_m2.gpkg)
path = "../hdb_m2.gpkg"
label = "HDB"
role = "fill"
# roof height from storeys (M2): HDB's floor to floor is 2.8 m, the void deck ~0.8 m more and the roof slab, parapet
# and the lift motor rooms and tanks on it ~3 m: 2.8 x storeys + 4 (12 storeys 37.6 m, OSM's mappers 36-41; 30
# storeys 88 m). OSM's HDB heights are no measurement (3.0, 3.33 and 3.4 m x storeys exactly on 23 of 44); the one
# measured block, Pinnacle@Duxton, 50 storeys 156 m, has taller floors and its sky bridges (the landmark list sets
# it). One- and two-storey blocks (markets, hawker centres, bin centres): 4 m a storey
height = "where(max_floor_lvl > 2, max_floor_lvl * 2.8 + 4.0, where(max_floor_lvl > 0, max_floor_lvl * 4.0, 0))"
keep = ["blk_no", "st_cod", "postal_cod", "max_floor_lvl", "year_completed", "residential", "commercial",
    "multistorey_carpark", "podium_fix"]
lend = ["max_floor_lvl", "year_completed", "residential", "commercial", "multistorey_carpark"]

[sources.est]               # height estimates for OSM's untagged buildings (scripts/m2_heights.py: osm_est.gpkg)
adapter = "file"
# copies of the OSM outlines with no height or levels, field est = the median height of their tagged neighbours of a
# similar footprint (checks/m2_estimates.md); plus the OSM outlines with layer=-1 that stand on the ground (Ocean
# Financial Centre, two hotels): their copy is what keeps them ([buildings] surface_layers)
path = "../osm_est.gpkg"
label = "estimate"
role = "fill"
height = "est"
keep = ["est_src"]

[sources.ura]               # URA Master Plan 2019 Building layer (footprints only: BLDG_TYPE, no heights), data.gov.sg
adapter = "file"
path = "ura_building/ura_mp2019_building.geojson"
label = "URA MP2019"
role = "fill"
keep = ["bldg_type"]

[buildings]
parts = true                # the CBD towers' building:part outlines (UOB Plaza, Republic Plaza, MBS's towers)
# canopies (123 "roof": petrol stations, Bugis Street's, covered walkways), building sites (29: IR2, NS Square,
# Skywater Residences, W Singapore Marina View; topped-out ones checked in M2: none confirmed), bridges
osm_skip = ["roof", "yes;roof", "carport", "shelter", "bridge", "construction", "ship"]
# OSM's layer=-1 outlines that stand on the ground: location=surface ones (MBFC's podium) and the untagged ones a fill
# source's polygon covers ([sources.est]: Ocean Financial Centre, Old SSVF HQ, Parkroyal Collection Marina Bay); the
# rest (Dhoby Ghaut MRT station 23,500 m², Bencoolen station, an underpass) go
surface_layers = true
# untagged train_station / transportation outlines of 150 m² or more are station boxes under the street (the MRT is
# underground here): dropped, never estimated (replaces m2_heights.py's station list; entrances keep set_h 4.5 m)
station_untagged = "drop"
# M3 fix round: "gaps" (engine opt-in) lifts only parts with a gap under them: Pinnacle@Duxton's two
# skybridges (72-75, 147-150 m) and the National Stadium's roof rings over its 20 m bowl (m2_heights.py STADIUM_BOWL);
# parts_fill_shafts closes the slots under 5 m wide between a tower's parts (Asia Square Tower 2 solid)
lift_parts = "gaps"
parts_fill_shafts = 5.0
# OSM polygons over this are estate outlines unless tagged or named as one building (Shenzhen's 5,000 m²): here the
# untagged ones of 5,000-20,000 m² are buildings (the City Terminals' sheds at 20 m, Sentosa's 15,400 m² hall, River
# Valley's condo blocks), 27 of them were lost at 5,000 m²
osm_max_area = 20000
# a building inside an outline dropped as an estate (holding 2 or more) stays (Ascott Raffles Place's tower, Robinson
# Suites, Grand Park City Hall's wings): no duplicate of an outline that goes itself
container_inner = true
# pieces overlapping on the map and in height are one volume drawn twice: the lesser is clipped by the better (OSM's
# over a fill's, then the taller): Shaw House over Shaw Centre, Mandarin Oriental over its base (critic M2 round 1)
volume_dedupe = true
# the Sultan Mosque's outline holds its four minarets (7 m² each, under min_piece): kept, not an estate outline
keep = { osm = ["w155990076"] }
# left out by OSM id, set_h and osm_fix: generated by `uv run python scripts/m2_heights.py --toml` (the reasons are in
