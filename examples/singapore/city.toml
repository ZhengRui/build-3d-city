# the town past the 500 m masses band and the backdrop coloured from ESA WorldCover 2021 (06e_masses: cover.jpg,
# cover_inner.jpg), not by height: Bukit Timah's forest, the HDB towns, Johor's and Batam's shores (London's settings);
# OSM's roads painted into the inner map as the town's street grid, the masses' footprints in the town colour
