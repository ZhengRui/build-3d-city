# London: the City, Westminster, the South Bank and Bankside, the Tower and Wapping to Limehouse, the Isle of Dogs
# (Canary Wharf), Battersea Power Station and Nine Elms, south Camden (the BT Tower) and Maritime Greenwich with the
# peninsula. Every city-specific setting of the build-3d-city pipeline; the engine
# (.agents/skills/build-3d-city/engine/pipeline, its README lists every key with its default) and the region preset
# "europe-west" hold the rest. Run a stage with `uv run city3d <stage>` from this folder, everything with
# `uv run city3d all`.

name = "london"
title = "London"
# Script-written settings, kept out of this file so that a script run does not rewrite (and commit) it again:
# the [[structures]] figures of scripts/*_structures.py, in generated/ (laid under this file in list order, then
# this file's own [[structures]]; see the engine README, `include`)
include = ["generated/structures-m4h.toml"]
# London's preset (M4): "uk-london", built on Western Europe's "europe-west" (its building kinds, roads, trees, cars
# and rooftop items) with London's facade styles (stock brick and stucco terraces, mansion blocks, Portland stone,
# estates, warehouses, muted curtain walls), roof shapes (slate behind parapets, pitched slate, no zinc mansards) and
# rooftop programmes (party-wall stacks with pots); the style rules read [facade.london] below. Trees, cars (black
# cabs, red buses) come in M5-M6 from data/region_research.md; see README "Region preset"
preset = "uk-london"
# UTM 30N (central meridian 3 W). London straddles the Greenwich meridian, 3 degrees east of the zone's centre:
# scale 1.00013, grid north 2.3 degrees west of true north, as Shenzhen (3 degrees off its zone's centre). The
# British National Grid (EPSG:27700, the UK data's CRS, central meridian 2 W) would be no better here (1.5 degrees),
# and every stage, the viewer's index JSONs and the reports assume a UTM zone; the sources are warped as they load
utm_epsg = 32630
coast = false               # the tidal Thames is a river polygon (OSM water=river, tidal=yes); no natural=coastline
                            # within 25 km (the coastline ends in the estuary, beyond Dartford)
drive = "left"
# metres per storey for OSM building:levels (on 51-67 % of the City's and Westminster's buildings, 7-10 % of
# Southwark's and Lambeth's; height on 0.1-3 %, Phase 0). Measured on the 344 OSM buildings in the boundary tagged
# with both (checks/sources.md §3): median height / levels 3.22 m (p25 3.00, p75 4.50); Georgian and Victorian terraces have tall ground
# and first floors (3.5-4 m) and ~2.8 m upper ones, offices 3.8-4.2 m, post-war flats 2.7-2.9 m
level_h = 3.2
user_agent = "3D-Fun london reconstruction (hobby project)"
# Local Overpass first: Docker container city3d-overpass-london, built from BBBike's London extract of 25-26 Sept
# 2026 (raw/osm/London.osm.pbf, box lon -0.6..0.42, lat 51.28..51.70); if it is down: `docker start
# city3d-overpass-london`. The public servers time out on the boroughs' queries from this network (Phase 0)
overpass = ["http://127.0.0.1:8798/api/interpreter", "https://maps.mail.ru/osm/tools/overpass/api/interpreter",
    "https://overpass-api.de/api/interpreter", "https://overpass.kumi.systems/api/interpreter",
    "https://overpass.private.coffee/api/interpreter"]

# The user's boundary (30 Sept 2026, "Core + Canary Wharf + Greenwich"; the Phase 0 boundary note,
# demos/data/phase0/london.md): the City of London (admin_level 6) and the whole City of Westminster by relation;
# the rest are lon/lat rectangles intersected with their borough (05: the clip is cut by the relation, so the
# river edges follow the borough boundaries in mid-Thames). Phase 0's rectangles, except: Lambeth reaches south to
# 51.478 (Vauxhall and Lambeth's part of Nine Elms: St George Wharf Tower, the DAMAC tower, the Keybridge towers);
# Wandsworth's Battersea clip reaches east to the Lambeth line (One Nine Elms);
# Tower Hamlets west steps back to -0.045 south of 51.515, where the Isle of Dogs clip begins (Phase 0's two clips
# overlapped by 0.83 km² at Limehouse); the Isle of Dogs clip reaches east to 0.000
[districts]
"City of London" = 51800
"City of Westminster" = 51781
# Bankside, Borough, London Bridge and the Shard, Bermondsey riverside to Jamaica Road
"Southwark (riverside)" = { relation = 8450265, clip = [[-0.115, 51.512], [-0.115, 51.4975], [-0.090, 51.4930], [-0.062, 51.4935], [-0.062, 51.512], [-0.115, 51.512]] }
# the South Bank, the London Eye, Waterloo, Lambeth Palace, Vauxhall, Nine Elms (Lambeth's part)
"Lambeth (riverside)" = { relation = 184710, clip = [[-0.150, 51.512], [-0.150, 51.478], [-0.108, 51.478], [-0.108, 51.512], [-0.150, 51.512]] }
# the Tower of London, Aldgate, Spitalfields, Whitechapel, Wapping, Shadwell, Limehouse
"Tower Hamlets (west)" = { relation = 51805, clip = [[-0.080, 51.530], [-0.080, 51.500], [-0.045, 51.500], [-0.045, 51.515], [-0.030, 51.515], [-0.030, 51.530], [-0.080, 51.530]] }
# the Isle of Dogs: Canary Wharf, the West India and Millwall docks, Blackwall reach (east to the meridian, past
# Phase 0's -0.005: Ontario Tower and the Blackwall Basin's east side)
"Isle of Dogs (Canary Wharf)" = { relation = 51805, clip = [[-0.045, 51.515], [-0.045, 51.483], [0.000, 51.483], [0.000, 51.515], [-0.045, 51.515]] }
# Battersea Power Station, Nine Elms (Wandsworth's part, east to the Lambeth line: the US Embassy, Embassy Gardens,
# One Nine Elms; Phase 0's rectangle stopped at -0.130 and left One Nine Elms out), Battersea Park's east end
"Wandsworth (Battersea)" = { relation = 51906, clip = [[-0.160, 51.490], [-0.160, 51.474], [-0.115, 51.474], [-0.115, 51.490], [-0.160, 51.490]] }
# the BT Tower (Fitzrovia), Bloomsbury and the British Museum, Holborn, north of Covent Garden
"Camden (south)" = { relation = 51827, clip = [[-0.150, 51.532], [-0.150, 51.510], [-0.100, 51.510], [-0.100, 51.532], [-0.150, 51.532]] }
# Maritime Greenwich (the Old Royal Naval College, the Cutty Sark, the Royal Observatory and Greenwich Park), the
# peninsula with the O2 and the cable car, Deptford Creek's east bank
"Greenwich (Maritime Greenwich and the peninsula)" = { relation = 51902, clip = [[-0.025, 51.510], [-0.025, 51.470], [0.025, 51.470], [0.025, 51.510], [-0.025, 51.510]] }

# London's style rules (presets/uk_london/__init__.py): the districts counted as the west (Georgian squares and
# mansion blocks where the east and south have Victorian terraces and estates), the listed buildings, and the
# character of each place: conservation areas by name (planning.data.gov.uk, OGL; a name containing the key, the
# smallest area winning) over hand-drawn areas (lon/lat). Characters: georgian, stucco, victorian, mansion,
# portland (stone offices and institutions), offices (the City's mix of stone, glass and modern), glass (the
# tower clusters), warehouse (the docks), estate, greenwich (Maritime Greenwich's brick)
