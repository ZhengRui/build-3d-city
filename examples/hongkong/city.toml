    ["#efc12a", "", 10]]
# public light buses: the cream body under a red (non-scheduled) or green (scheduled) roof
minibus = [["#ede6d0", "#b8262c", 40], ["#ede6d0", "#2b7a4b", 60]]
# the trams' green livery and their all-over advertising wraps
tram = [["#1f5c3a", "#2a2d2b", 45], ["#b8262c", "#2a2d2b", 10], ["#2f5f9c", "#2a2d2b", 10], ["#ecebe4", "#2a2d2b", 10],
    ["#e8b622", "#2a2d2b", 8], ["#6a3d8a", "#2a2d2b", 5], ["#e07a24", "#2a2d2b", 6], ["#1c1d20", "#2a2d2b", 6]]
# the island: Citybus, a share of KMB's cross-harbour routes; Kowloon: KMB, Citybus's cross-harbour and airport routes;
# Sai Kung district (TKO, Clear Water Bay, Sai Kung town): green taxis beside the red, KMB
[[cars.areas]]
districts = ["Central and Western", "Wan Chai", "Eastern"]
weights = { bus = [15, 5, 80], bus_dd = [15, 5, 80] }
[[cars.areas]]
districts = ["Yau Tsim Mong", "Kowloon City", "Sham Shui Po", "Wong Tai Sin", "Kwun Tong"]
weights = { bus = [62, 20, 18], bus_dd = [62, 20, 18] }
[[cars.areas]]
districts = ["Sai Kung"]
weights = { taxi = [45, 55], bus = [65, 22, 13], bus_dd = [65, 22, 13], minibus = [20, 80] }
# the tramway (OSM railway=tram, 13 km each way): one tram every ~250 m on each track (a tram every 1-2 minutes on
# Des Voeux and Hennessy Road), single cars at ~15 km/h between stops
[cars.trams]
modules = ["tram"]
gap = 0.25
speed = 4.5
spacing = 250.0

# M6: rooftops (the hk-hongkong preset's programmes, presets/hk_hongkong/rooftops.py): estate and apartment towers as
# Singapore's HDB blocks without PV (lift motor rooms over the cores, the water-tank housing on the plant room, aerial
# masts); no helipad markings (a Mainland fire-code look); tong lau and village houses keep the region's clutter (stair
# hoods, steel and plastic tanks, rooftop huts and plants)
[rooftops]
helipads = false
# (M4 fix round 1) projecting street signs on the tong lau and composite buildings' street fronts: boxes standing out
# from the wall on floors 1-6, lit after dark (presets/hk_hongkong/rooftops.py; the viewer's rooftops.js `sign`)
street_signs = true

