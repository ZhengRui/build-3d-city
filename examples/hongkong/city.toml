# Hong Kong, option E (the user's choice, 6 Oct 2026): Victoria Harbour's both shores, Hong Kong Island's north
# shore from Kennedy Town to Chai Wan with Mid-Levels and the Peak, Kowloon up to the Lion Rock and Beacon Hill
# ridge (Kai Tak, Kwun Tong, Lei Yue Mun), and beyond the Devil's Peak / Kowloon Peak ridge Tseung Kwan O, Clear
# Water Bay and Sai Kung. Every city-specific setting of the build-3d-city pipeline; the engine
# (.agents/skills/build-3d-city/engine/pipeline, its README lists every key with its default) and the region preset
# "china-south" hold the rest. Run a stage with `uv run city3d <stage>` from this folder, everything with
# `uv run city3d all`. Boundary, sources and checks: README.md, checks/m1_sources.md.

name = "hongkong"
title = "Hong Kong"
# M4: Hong Kong's own preset, on china-south (presets/hk-hongkong.toml): kinds per building (LandsD's rows grouped,
# podiums, malls and civic halls by type and name) and its facade styles (estate, apartment, tonglau, composite,
# industrial, colonial; REPORT.md "M4 facades"); china-south's other tables (species, cars, rooftops) until M5-M6
preset = "hk-hongkong"
# UTM 50N (central meridian 117 E; Hong Kong lies at 114.2 E). The local data (LandsD, CEDD LiDAR, the 5 m DTM) is
# HK1980 Grid, EPSG:2326, read as such and warped as it loads
utm_epsg = 32650
coast = true
drive = "left"
user_agent = "city3d (you@example.com)"
# M4 landmarks (b-hk-m4l): the figures scripts/m4l_structures.py writes (masts, crowns, the Bank of China's prisms, the
# CGO's open door, the ferry piers' decks, Stonecutters Bridge...): engine README, "Generated settings"
include = ["generated/structures-m4l.toml", "generated/structures-m7f.toml"]
# M7 fix round 1 (b-hk-m7f): Tsing Ma and Kap Shui Mun bridges, beyond the tiles' extent (scripts/m7f_structures.py)
# The local Overpass first (the user's container, from openstreetmap.fr's hong_kong-latest.osm.pbf; not up during
# M1: connection refused falls through), then the public mirrors Berlin lists
overpass = ["http://127.0.0.1:8786/api/interpreter", "https://maps.mail.ru/osm/tools/overpass/api/interpreter",
    "https://overpass-api.de/api/interpreter", "https://overpass.kumi.systems/api/interpreter",
    "https://overpass.private.coffee/api/interpreter"]

# Option E snapped in M1 (scripts/m1_boundary.py; README "Boundary"): the OSM districts (admin_level 6) each cut by
# the snapped polygon: the shores keep the hand line in the water, country parks are in or out whole (by the
# larger share), islands likewise, and the town edges grown 300 m over non-park land where the hand line cut
# streets. A plain id: the snapped polygon holds all of that district's land; else the district's clip is its
# Feature in data/boundary_districts.geojson (written by the same script).
#@districts (generated by scripts/m1_boundary.py: demos/data/hongkong/districts_E.toml)
[districts]
"Central and Western" = { relation = 2558879, clip = "data/boundary_districts.geojson" }
"Wan Chai" = { relation = 2558883, clip = "data/boundary_districts.geojson" }
Eastern = { relation = 2558880, clip = "data/boundary_districts.geojson" }
"Yau Tsim Mong" = 2670978
"Kowloon City" = 2800201
"Sham Shui Po" = 2800200
"Wong Tai Sin" = 2800277
"Kwun Tong" = 2800276
"Sai Kung" = { relation = 8189562, clip = "data/boundary_districts.geojson" }
#@end

[osm]
# M2: OSM outlines tagged underground=yes, location=underground|indoor or on a level below 0 go (the MTR's station
# boxes and the malls under Central, TST and Kowloon Station; LandsD has none of them, so OSM would fill them in)
underground_drop = true

[sun]                       # early November: Hong Kong's clear, dry season (the north-east monsoon)
latitude = 22.30
declination = -16.0

[sources]
# LandsD's Building layer first (M1, checks/m1_sources.md): footprints of every permanent building, split into
# blocks (towers and podiums as separate rows), with BaseHeight and TopHeight in mPD; OSM fills what it lacks
footprints = ["landsd", "osm"]
heights = ["landmark", "landsd", "osm_height", "osm_levels", "default"]
dem = "geotiff"             # CEDD 2020 LiDAR DTM (bare earth), then the LandsD 5 m DTM (whole territory)
backdrop = "geotiff"        # the 5 m DTM, Copernicus GLO-30 beyond Hong Kong (Shenzhen's hills to the north)

[sources.landsd]            # Lands Department, Building (DATA.GOV.HK terms), raw/landsd_building/README.txt
adapter = "file"
# CSDI FeatureServer pages over E's box + 600 m (w-hk-data, 6 Oct 2026; vintage v20260921), in HK1980 Grid, with the
# ground under each row added by scripts/m2_landsd_prep.py (M2): ground_mpd = the LOWEST LiDAR DTM cell along the
# row's outline (2 m, back in mPD: + 1.30), which is where 06_tiles stands the building (Terrain.bases: the lowest
# ground under the outline), so a hillside tower reaches its surveyed top from the foot of its downhill wall
path = "../landsd_prepared/landsd_E600_ground.gpkg"
crs = "EPSG:2326"
label = "LandsD"
role = "primary"
# m: from the ground to the block's top. LandsD's BaseHeight is the block's own base: a tower on a podium has its
# base on the podium's roof (Two IFC 29.7 mPD; Times Square Tower One 75.6), so TopHeight - BaseHeight (M1) was its
# height over the podium (Times Square 123 m for 194). Every row now stands on the ground and reaches TopHeight; a
# tower drawn through its podium is kept (dedupe_keep_taller) and cut out of it (volume_dedupe). Temporary
# structures without a TopHeight (3,019: sheds, site offices) are one storey (top_mpd = ground + 3 m)
height = "top_mpd - ground_mpd"
keep = ["BuildingCSUID", "BuildingID", "BuildingBlockType", "BuildingNameEN", "BuildingNameTC", "BaseHeight",
    "TopHeight", "Storeys", "StoreysInBasement", "min_h", "elevated", "deck_tower", "support", "ground_src"]
# (the row's own ground and top, for [buildings] own_ground and 04b_quality's check of each piece against them)
rename = { ground_mpd = "ground_elevation", top_mpd = "roof_top_z" }
# open-sided structures (covered walkways, petrol-station and bus-terminus canopies, footbridge roofs) are no solid
# boxes: left out (M2: no walls from the ground; footbridges come with M3's roads). Rows standing on nothing (base
# 3 m+ over the highest ground under them, under half over another row) and 10 m or less over their base are the
# enclosed footbridges, link bridges and decks: raised pieces from their base (min_h, scripts/m2_landsd_prep.py)
# Rows whose top is at most 0.5 m over their lowest ground (a station box under a park, tanks, blocks cut into a slope)
# stand under it: left out (m2_drop "sunk")
drop = { BuildingBlockType = ["Open-sided Structure"], m2_drop = ["sunk"] }

[sources.geotiff]
# scripts/m1_dem_prep.py: the CEDD 2020 LiDAR DTM tiles (0.5 m, 750 x 600 m, EPSG:2326, mPD) averaged to 2 m (the
# raw 0.5 m tiles would be merged whole at their resolution by 05a_terrain: ~9 GB), and the LandsD 5 m DTM; both
# shifted from Principal Datum to mean sea level (- 1.3 m: MSL is ~1.30 m above HKPD, GeoInfo's notes on geodetic
# datums, 1997-2015 at Quarry Bay; the scene's sea at 0 is mean sea level). The LiDAR tiles cover E + 500 m; the 5 m
# DTM fills the rest of the 3 km ground margin, though it has bridges and podiums baked in (raw/OFFICIAL_SUMMARY.md):
# M3 should fetch the LiDAR tiles of the margin's land (Sha Tin, Kwai Chung, Tsing Yi, Aberdeen; ~300 more tiles,
# ~1.4 GB [believed]) or accept the 5 m DTM there, where only the painted roofscape stands
# M3: the ground DEM is the LiDAR alone; the margin beyond it (E + 500 m) is [terrain] gap_fill's, from the backdrop's
# first entry, the 5 m DTM, lowered by the two DEMs' difference (median -2.87 m: its bridges, podiums and trees)
ground = ["../dem_prepared/lidar2020_dtm_2m_msl.tif"]
backdrop = ["../dem_prepared/dtm5m_msl.tif", "Copernicus_DSM_COG_10_N22_00_E113_00_DEM.tif",
    "Copernicus_DSM_COG_10_N22_00_E114_00_DEM.tif"]
bare = true
note = "CEDD 2020 LiDAR DTM (0.5 m bare earth, averaged to 2 m), then the LandsD 5 m DTM, both mPD - 1.3 m = m above mean sea level; Copernicus GLO-30 (EGM2008, a surface model) beyond Hong Kong."
[sources.copernicus]
tiles = ["N22_00_E113_00", "N22_00_E114_00"]

[compare]
detail = [114.1585, 22.2830, "Central"]

[buildings]                 # M2 (b-hk-m2, 6 Oct 2026): LandsD is primary, OSM fills only what it lacks
# OSM tags never extruded: canopies and roofs (1,107 "roof": covered walkways, petrol stations), building sites (360
# "construction": Kai Tak, Kowloon East; LandsD is surveyed, so a built tower is in it), bridges (64: footbridges and
# their roofs), shelters, carports, ships
# M2 fix round 2: "service" (36 OSM fill pieces, nearly all the Water Supplies Department's service reservoirs: covered
# tanks dug into the hillsides with a playground or lawn on top, 11.6 ha extruded as 3.5-9.6 m boxes on slopes; TKO
# Primary 18,110 m², Mount Davis 15,396, Lam Tin 10,892); LandsD's own surveyed tanks stay
osm_skip = ["roof", "yes;roof", "carport", "shelter", "bridge", "construction", "ship", "service"]
# Black's Link's tank (building=yes, a reservoir by name) and Yau Tong Industrial Building Block 4 (3,924 m², no
# LandsD row: demolished for the Yau Tong redevelopment)
exclude = { osm = ["w646146710", "w175372514"], buildingcsuid = [
    # M4 landmarks: LandsD rows rebuilt as figures by scripts/m4l_structures.py (it prints this list): the ferry piers
    # on their piled decks (Central Piers 2-10, the Central Government Pier, the Star Ferry's at Tsim Sha Tsui, Wan Chai's),
    # the Clock Tower, Kai Tak Stadium;
    "3408016626T20050430", "3418216606T20050430", "3427316583T20050430", "3436716557T20050430", "3446416525T20050430",
    "3455616499T20050430", "3465316464T20050430", "3467216382T20060926", "3474316428T20060926", "3541917205T20050430",
    "3551517187T20050430", "3620416053T20141003", "3837920357T20241029",
    # the Peak Tower, the CGO, the Cultural Centre's auditoria; (M7) the Space Museum's dome row
    "3348614712T20050430", "3508215732T20110704", "3560617222T20050430", "3575217258T20050430"] }
# untagged train_station / transportation outlines of 150 m² or more: the MTR's station boxes under the street
# (Central, Admiralty, TST...); the elevated stations (Kwun Tong line, East Rail) are LandsD rows
station_untagged = "drop"
# every LandsD row stands on its ground and reaches its own TopHeight ([sources.landsd]): a tower lying in its podium
# row (LandsD's podium outlines hold their towers: 8,931 tower rows over half inside one) is kept, not dropped as the
# podium's smaller duplicate, and volume_dedupe cuts it out of the podium; own_ground: no row is stood on the roof of
# the one it lies in (nested) or stacked on it
dedupe_keep_taller = true
volume_dedupe = true
own_ground = true
# roofs (Wikipedia's infoboxes, read 6 Oct 2026): Central Plaza's TopHeight includes its mast (376.8 m): roof 309; the
# Bank of China's LandsD top is 303.1 m from its lowest ground: roof 315 (top floor 288.3, masts 52.4 m to 367.4). The
# masts are M4's, as The Center's (LandsD's roof 291 kept). Crowns and spires LandsD leaves out (Langham Place 255,
# The Masterpiece 261, Lee Garden One 240...) are use_height false rows of data/landmarks.csv: M4's
# M4 landmarks: the Bank of China's row keeps the full square to its north prism's wall top (floor 25, 103 m); the four
# prisms, their sloped roofs to 315 m and the masts are figures (scripts/m4l_structures.py); Central Plaza's row (the
# lot, 3,656 m², not the triangle) is its 30.5 m podium, the tower, its pyramid to 309 m and the mast a figure
# HKCEC's New Wing row to its eaves (28 m) under the wing roof figure
fix_h = { buildingcsuid = { "3593215701T20050430" = 30.5, "3468315577T20050430" = 103.0, "3587616033T20101020" = 28.0 } }

# china-south's "village" kind (12-40 m on a plot under 450 m²) is an urban village there; here it is 11.5k tong lau
# and pencil towers, 94 % in the urban districts: drawn as midrise. Hong Kong's villages (Sai Kung, Clear Water Bay:
# 3-storey houses under 12 m) are china-south's "house" kind already
kind_map = { village = "midrise" }
# LandsD's heights are surveyed: copied() (a small piece carrying a touching tower's height, lowered) leaves them alone
# (it had cut Chatham Gate's 34 m sky bridge at 113 mPD down to a 78 m column under its own base)
copied_keep = ["landsd"]
# the table's geometries repaired as written (the WGS84 reprojection left 25 clipped pieces invalid)
valid_out = true

[buildings.landmarks]
# a landmark's point lies on its tower row and on the podium row holding it: of the rows within 40 m, the one whose
# height is closest to the listed one (IFC's crown 412 on Two IFC's tower, not its 40 m podium)
match = "best"

[ground]
margin = 3000               # the LiDAR ridges behind the towers (Mount Gough, Cameron, Nicholson, Jardine's Lookout)
# beyond the boundary: a painted roofscape only (Edges, decided 6 Oct 2026), no block masses: almost every edge
# is water or country-park mountains, which the terrain draws
town = true
# M7 fix round 1 (b-hk-m7f; critic M7: the margin's new towns, Sha Tin, Kwai Chung, Tsing Yi, Tsuen Wan, read as empty
# grids where walls of 30-40 storey estates stand): every OSM building of 30 m or more in the margin and 2.5 km beyond
# it as a mass (heights from building:levels, which most estates carry; LandsD's rows end at 114.117 E / 22.40 N, short
# of Tsing Yi, Tsuen Wan and Ma On Shan), at full height (no thinning); the low town stays painted roofscape. This
# extends the 6 Oct edge decision ("painted roofscape only, no masses"), as Singapore's M7 did: a switch for the user. To
# drop it: masses = false (and re-run 06_tiles, 06e_masses, 07_pack, 07b_blocks)
masses = true
masses_min_h = 30.0
masses_reach = 2500.0
masses_thin = false
# M3 fix round (critic: Central's ferry piers stood as boxes straight in the sea, read as barges): OSM's man_made=pier
# decks join the land (New York's setting), so the pier buildings stand on a deck with a quay edge round it
piers = true
# M5 (Singapore's engine opt-in): the public cargo working areas (Western District, New Yau Ma Tei, Chai Wan) and, in the
# margin, the Kwai Tsing container terminals and Stonecutters (OSM industrial=port) as paved concrete yards on the
# aeroway layer, not the land's patchwork with trees
yards = ["industrial=port"]
# M5 (engine opt-in): Hong Kong's cut slopes (the slope register's shotcrete faces, mapped in OSM as natural=cliff lines,
# man_made=cutting and embankment, the crest drawn with the face on its right) as 10 m grey strips on the aeroway
# layer, below the crest; natural cliffs (Lion Rock's face) read as grey rock the same way
# M7 fix round 1 (engine opt-in slopes.areas): OSM's bare rock and scree polygons the same grey, the green cut round them:
# Lion Rock's crown and its south crag (獅肚大坡板), Kowloon Peak's and Beacon Hill's rock read as smooth green domes
slopes = { tags = ["natural=cliff", "man_made=cutting", "man_made=embankment"], width = 10.0, areas = ["natural=bare_rock", "natural=scree"] }

[roads]
margin = 500                # most edges are water
# M3: footways on bridges drawn as decks (hundreds of footbridges over Central's, Wan Chai's and Kowloon's roads; the
# Central Elevated Walkway); the pavements along road bridges stay out (the default rule)
footbridges = true
# stacked interchanges and flyovers (OSM layer 2-4: checks/m1_sources.md §7) at 7.5 m a layer, the default

# Singapore M3 fix round's shore opt-ins (engine): the beaches' sand reaches 3 m into the sea and the
# rock revetments' 7 m (their bands squeezed, the shader's across coordinate kept: no sand glowing 10-20 m out), and
# the closed coast loops under 120 m across (Port Shelter's and Junk Bay's rocks and islets) get revetment, not a beach
[shores]
water_side = { beach = 3.0, revetment = 7.0 }
islet_max = 120.0
islet_type = "revetment"

[terrain]
far_reach = 20000.0         # Tai Mo Shan, Ma On Shan, the Sai Kung peninsula, Lantau's peaks from the Peak
# M7: the named summits beyond the ground area ([terrain.peaks], "(backdrop)") pinned as backdrop TIN vertices at their
# surveyed heights (the 200 m average had them 24-86 m low: Lantau Peak 883 for 934, Sunset Peak 845 for 869, Castle
# Peak 497 for 583, Lamma's Mount Stenhouse 321 for 353)
back_peaks = true
# the LiDAR mosaic and the territory's 5 m DTM are one EPSG:2326 run: merged only over the grid each step fills,
# on the LiDAR's pixel grid, through a temporary file (02_dem merged the whole territory at 2 m: 10.2 GB; now 1.8
# GB, 05a_terrain 1.9 GB)
dem_window = true
# M3: the LiDAR is a bare-earth DTM, already at mean sea level and accurate at the waterfront: the GLO-30 coast
# defaults (sea_drop 3 + knee 2, coast_flat 40, coast_ramp 160, smooth_bare 15) flattened the harbourfront (0.9 m at
# 50-100 m inland where the LiDAR reads 9.8; TST and Kai Tak at 0) and cut the summits (the Peak 538, Gough 447).
# b-hk-terrain's settings (REPORT Known issue 13): the reclaimed land meets the sea within 10-50 m, summits within 3 m
smooth_bare = 6.0
sea_drop = 0.0
sea_knee = 0.5
coast_flat = 10.0
coast_ramp = 40.0
# the TIN within 2 m of the LiDAR in the districts (default 4 m: the TST promenade's and Tamar's 3-4 m plateaus came out
# 0-1 m and 6 m)
tin_error = 2.0
# the LiDAR covers E + 500 m; the rest of the 3 km ground area from the 5 m DTM (the backdrop's first DEM), opened 30 m
# and smoothed 15 m, offset by the two DEMs' difference along the LiDAR's edge, easing into the median over 600 m
gap_fill = { open = 30.0, smooth = 15.0, edge = 150.0, blend = 600.0 }
# Singapore M3's fix (engine opt-in): the area's edge cells take the land of the cells inside (no coast ramp along it)
edge_land = true
# the 2020 LiDAR's excavations of sites built since (Kai Tak's Monaco and The Henley, Grand Victoria, NCB Innovation
# Centre, The Twins: 126 LandsD rows over them, down to -18 mPD; REPORT Known issue 15) re-filled from their outlines:
# scripts/m3_pits.py finds each in the LiDAR (1.5 m+ under the street round its row, connected to the row, within 150 m)
# and writes the outlines (engine opt-in patches_file). The generic `pits` rule spread over every valley of the steep
# island (1,362 "pits", 13,817 ha, up to 187 m raised)
patches_file = "data/m3_pits.geojson"
# M4 landmarks: Stonecutters Bridge's landings (Known issue 42): the margin's 5 m DTM has the approach viaducts baked in
# as pale mounds up to the deck; re-filled from the ground round them (the bridge is a figure, scripts/m4l_structures.py)
patches = [[[114.115408, 22.32899], [114.112493, 22.331233], [114.111627, 22.330259], [114.114543, 22.328017]],
    [[114.12257, 22.323481], [114.125485, 22.321239], [114.12462, 22.320265], [114.121705, 22.322508]]]
# summits searched within 150 m of their point (1 km took the Peak's 549 for High West and Lung Fu Shan)
peak_radius = 150.0
# the ground beyond the roads' margin (the painted town) and the backdrop coloured from ESA WorldCover 2021 (06e_masses
# --cover-only: no masses), as Singapore and London; OSM's roads painted into the inner map as the town's streets
backdrop_cover = "worldcover"
backdrop_town_rgb = [112, 110, 104]
# M5: the yards ([ground] yards) painted into the land cover maps as concrete: Kwai Tsing's terminals beyond the ground
# area were WorldCover's pale built-up on a sea-coloured plain (critic M3a)
cover_yards = [98, 97, 94]
cover_roads = { motorway = 24.0, trunk = 18.0, primary = 14.0, secondary = 12.0, tertiary = 10.0, residential = 8.0, unclassified = 8.0, living_street = 6.0 }
# named points for 02_dem's report besides the peaks (expected m above mean sea level)
spots = { "Tamar Park (reclaimed harbourfront)" = [114.1655, 22.2815, 4.0], "TST promenade" = [114.1730, 22.2935, 4.0], "Kai Tak former runway" = [114.2025, 22.3155, 4.0] }
# named summits, for checks/terrain.md: lon, lat, surveyed height (m; OSM natural=peak ele, Phase 0 research.json)
[terrain.peaks]
"Victoria Peak (Tai Ping Shan)" = [114.14546, 22.27604, 552]
"High West" = [114.13629, 22.27217, 494]
"Mount Gough" = [114.15966, 22.26864, 479]
"Mount Kellett" = [114.1486, 22.26169, 500]
"Mount Cameron" = [114.17511, 22.26241, 439]
"Mount Nicholson" = [114.1857, 22.25961, 429]
"Jardine's Lookout" = [114.19833, 22.26636, 433]
"Mount Butler" = [114.21112, 22.26767, 435]
"Mount Parker" = [114.21988, 22.26597, 532]
"Braemar Hill" = [114.20644, 22.28642, 200]
"Bowen Hill" = [114.1679, 22.26995, 320]
"Lung Fu Shan" = [114.1351, 22.27983, 265]
"Lion Rock" = [114.18717, 22.35301, 495]
"Beacon Hill" = [114.17039, 22.34975, 457]
"Tate's Cairn" = [114.21786, 22.35772, 577]
"Kowloon Peak (Fei Ngo Shan)" = [114.22334, 22.34064, 602]
"Devil's Peak" = [114.2439, 22.2938, 222]   # Phase 0's point (114.237, 22.296) lay at Lei Yue Mun, 19 m: moved to the LiDAR summit (M1)
# M7: Tai Mo Shan at OSM's summit node (Phase 0's point lay 250 m off it); the far backdrop's summits from OSM's
# natural=peak nodes (the local Overpass, 7 Oct 2026), pinned at their surveyed heights in the backdrop TIN
# (back_peaks; those inside the ground area are only checked)
"Tai Mo Shan" = [114.12459, 22.41012, 957]
"Grassy Hill" = [114.16589, 22.4117, 647]
"Needle Hill" = [114.16063, 22.38689, 532]
"Buffalo Hill" = [114.23436, 22.37459, 606]
"Ma On Shan" = [114.25239, 22.40906, 702]
"Pyramid Hill" = [114.25283, 22.39676, 536]
"Violet Hill" = [114.2, 22.24897, 435]
"Mount Collinson" = [114.23492, 22.25143, 348]
"Lantau Peak (backdrop)" = [113.91994, 22.2493, 934]
"Sunset Peak (backdrop)" = [113.95273, 22.25733, 869]
"Lo Fu Tau, Discovery Bay (backdrop)" = [114.00015, 22.29958, 465]
"Castle Peak (backdrop)" = [113.95331, 22.38828, 583]
"Mount Stenhouse, Lamma (backdrop)" = [114.12769, 22.19175, 353]
"High Junk Peak" = [114.2859, 22.2956, 344]
"Hebe Hill" = [114.2416, 22.3419, 346]
"Black Hill" = [114.2446, 22.3097, 304]

# M6: trees. Hong Kong's streets are not lined end to end as Shenzhen's: Mong Kok's, Central's and Wan Chai's are mostly
# bare, the newer towns' (TKO, Kai Tak) planted; LCSD's roadside trees are Chinese banyans, camphor, Bauhinia (the
# city flower), flame and cotton trees, few palms; the hillsides secondary woodland (the region preset's mixes)
[trees]
none_extra = ["industrial=port", "landuse=port"]
# M6 (engine opt-ins; critic M3b: the instanced forest stopped on hard lines where OSM's wood polygons end, bare olive
# paint beyond): land OSM leaves without green or land use takes ESA WorldCover 2021's class (trees, shrubs, grass)
# at 24 m; the forest's edge frays over 60 m, and the area trees thin out over the ground area's last 300 m to the
# painted backdrop
worldcover = { "10" = "forest", "20" = "scrub", "30" = "grass" }
# (the user's feedback, 6 Oct: from above the Peak half a hill wooded and half bare grass on a hard edge) OSM's grassland and
# scrub where WorldCover sees tree cover become forest too
worldcover_over = ["grass", "scrub"]
feather = { edge = 300.0, fringe = 60.0, into = ["scrub", "grass", "open"], share = 0.5 }
# M7 fix round 1 (engine opt-in; critic M7: pale stair-stepped squares on Lion Rock's, Sha Tin's and Kowloon Peak's hills
# beyond the trees): the far carpet also over the grass (a muted olive, web/city.json trees.carpetBlend) and its classes
# smoothed over 16 m, so the 24 m WorldCover cells' steps and the small grass holes in the canopy are gone
carpet = { extra = ["grass"], smooth = 16.0 }
[trees.street]
planted = { major = 0.6, minor = 0.35 }
[trees.street.odds]
major = [["palm", 0.03], ["flowering", 0.22]]
minor = [["palm", 0.02], ["flowering", 0.12]]
[trees.street.height]
palm = [9, 13]
flowering = [7, 11]
broadleaf = {major = [9, 15], minor = [7, 12]}
# M6 (engine opt-in side = "kerb"): Nathan Road's Chinese banyans along its kerbs (Kowloon Park's side the oldest); the
# median between its one-way carriageways is a railing strip, no trees (critic M3b: a boulevard of flowering trees
# and a palm down the middle)
[trees.street.named]
# (along Kowloon Park, Haiphong Road to Austin Road; the rest of Nathan Road, Jordan to Mong Kok, is bare: within)
"彌敦道 Nathan Road" = { species = "broadleaf", height = [13.0, 18.0], step = 11.0, rows = [2.4], first = true, side = "kerb", within = [[114.1698, 22.2968], [114.1752, 22.2968], [114.1752, 22.3040], [114.1698, 22.3040]] }

# M5: Hong Kong's road markings (Transport Department's Code of Practice: the British system, driving on the left):
# white lane lines and centre lines, double white lines on the big two-way roads, double yellow kerb lines (no
# stopping at any time) along the main roads and single yellow at junction mouths, bus lanes along the nearside kerb
# (plain asphalt with BUS LANE lettering, not red), signalled junctions with stop lines and the crossings' broken
# lines, zebras with zig-zags and flashing amber globes. The engine's UK options (London M5, Singapore M5)
[markings]
warning = 18.0
kerb_lines = { trunk = "yellow", primary = "yellow", secondary = "yellow" }
kerb_mouths = { tertiary = "yellow", residential = "yellow", unclassified = "yellow" }
bus_lanes = true
bus_red = 0.0
junctions = "signals"
zebras = true
zigzag = 14.0
signal_crossings = true

# M6: Hong Kong's traffic (Transport Department's 2025 licensed fleet: ~600k private cars, 18k taxis, 4.3k minibuses,
# ~6k franchised buses nearly all double-deck; white, silver and black cars, many Alphard/Vellfire MPVs and Teslas).
# Taxis by area: red urban taxis, green New Territories taxis in Sai Kung district; KMB in Kowloon (cream with red and
# the newer champagne livery), Citybus yellow on the island; red-top and green-top public light buses (the Toyota
# Coaster); the green double-deck trams on the island's tramway (Kennedy Town to Shau Kei Wan)
[cars]
types = [
    ["sedan", 4.70, 1.80, 1.45],                 # Corolla, Camry, Mercedes C/E, BMW 3/5, Model 3
    ["suv", 4.70, 1.88, 1.68, "crossover"],      # Model Y, Lexus RX/NX, X3, GLC
    ["taxi", 4.40, 1.70, 1.74],                  # Toyota Comfort Hybrid (JPN Taxi) and Crown Comfort: red, silver roof
    ["van", 4.95, 1.85, 1.95],                   # Alphard / Vellfire, HiAce
    ["bus", 12.0, 2.5, 3.2],                     # single-deck (Citybus and KMB's few)
    ["truck", 7.5, 2.3, 3.2],                    # light goods vehicles (Isuzu, Hino, Mitsubishi Canter)
    ["lorry", 16.5, 2.5, 4.0],                   # container tractors to and from Kwai Tsing
    ["moto", 2.0, 0.75, 1.2],
    ["bus_dd", 12.0, 2.55, 4.4, "bus_london"],   # ADL Enviro500, Volvo B8L, BYD/Alexander: the franchised fleet
    ["minibus", 7.0, 2.03, 2.65, "van"],         # Toyota Coaster: cream body, red or green roof
    ["tram", 12.0, 2.3, 4.6, "bus_london"],      # Hong Kong Tramways' double-deckers ([cars.trams])
]
# sedan, suv, taxi, van, bus, truck, lorry, moto, bus_dd, minibus (the tram: none parked)
parked_mix = [52, 22, 4, 14, 0, 4, 0, 3, 0, 1]
kerb_occupancy = 0.6
[cars.kerbside]
tertiary = 0.1
residential = 0.35
unclassified = 0.3
living_street = 0.3
road = 0.2
service = 0.15
# speed m/s, mean gap m, queue factor, mix [sedan, suv, taxi, van, bus, truck, lorry, moto, bus_dd, minibus]
[cars.class]
motorway = [20, 34, 0.8, [40, 14, 12, 9, 0.5, 8, 6, 2, 6, 3]]
trunk = [14, 30, 0.5, [36, 13, 16, 8, 0.5, 7, 3, 3, 9, 5]]
primary = [9, 24, 0.4, [28, 10, 23, 8, 1, 6, 0.5, 3, 13, 8]]
secondary = [9, 28, 0.4, [31, 11, 22, 9, 1, 6, 0, 3, 9, 8]]
tertiary = [8, 45, 0.4, [36, 12, 20, 10, 0.5, 7, 0, 3, 3, 8]]
residential = [6, 80, 0.4, [44, 15, 16, 12, 0, 6, 0, 4, 0, 3]]
unclassified = [6, 90, 0.4, [44, 15, 14, 12, 0, 8, 0, 4, 0, 3]]
living_street = [4, 160, 0.5, [50, 16, 12, 12, 0, 6, 0, 4, 0, 0]]
road = [6, 90, 0.4, [44, 15, 16, 12, 0, 6, 0, 4, 0, 3]]
service = [5, 180, 0.5, [48, 16, 8, 14, 0, 8, 0, 6, 0, 0]]
