[ground]
margin = 3000               # the ground area: the districts' box plus 3 km (Tokyo is flat; the bay is south-east)
town = true                 # beyond the districts: a painted roofscape (Phase 0 "Edges": a full ring would be 55k)
# block masses only on the bay rim now (the gaps are districts since the boundary change of 6 Oct 13:45): Toyosu
# (1.88 km²), Ariake (2.40) and Shibaura with the Konan wharves on the Keihin canal (3.16), blocks and the canals'
# edges (scripts/m3_rim.py), minus the district area (scripts/m3g_boundary.py), all inside the ground area
masses = true
masses_within = "data/masses_within.geojson"
# (M7, engine opt-ins) the Kanto plain's high-rise clusters beyond the area as masses (Singapore M7's tall-only clip):
# every OSM building tagged 60 m or more (height, or 19 storeys) within ~32 km (Ikebukuro's Sunshine 60, Shinagawa and
# Osaki, Musashi-Kosugi, Kawasaki, Minato Mirai, Makuhari, Saitama Shintoshin), fetched by Overpass with a tag filter
# (not every building of the plain); standing at their heights however far (no thinning); the low town stays the
# painted roofscape and the inner cover map keeps its reach
masses_reach = 27000.0
masses_thin = false
masses_tall_within = { file = "data/masses_tall_within.geojson", min_h = 60.0, tagged = true }
# (M3 fix round) mass outlines of 5,000 m² or more are held at 45 m (engine opt-in masses_tall): Big Sight, the market
# halls and podiums in the bay rim (first for CO·MO·RE Yotsuya's 10,570 m² outline at 145 m in the west gap, a real
# building since the boundary change); towers on their own outlines keep their heights
masses_tall = { area = 5000.0, h = 45.0 }
# (M7 fix round 1, engine opt-in; a decision for the user, drop the key to undo) a 2.5 km ring of town round the districts
# as masses (scripts/m7f_ring.py: D buffered 2.5 km, less D and the bay rim, inside the ground area): every OSM footprint
# there (from cover_buildings.gpkg, already fetched for the painted roofs), so the roofscape goes on past the area's edge
# (north of Ueno to Yanaka and Nippori, west of Nishi-Shinjuku, Sumida and Koto east of the Skytree) instead of a
# painted plain with 3D trunk roads and no buildings (M7 critic 1, item 2). Untagged footprints by the built cover round
# them at Tokyo's 2-4 storeys (6.5-13 m), not Paris's 7-17 m. No minor roads, trees or cars come with it
# (M8, engine opt-in masses_ring.edge: over the last 750 m to the ring's outer edge, data/masses_ring_outer.geojson from
# scripts/m7f_ring.py, the untagged masses fall to half height and 40 % of them drop out: the M7 critic's seam west of the TMG)
masses_ring = { file = "data/masses_ring.geojson", cover_h = [[0.15, 0.3, 0.45, 0.6], [6.5, 8.0, 10.0, 13.0]], edge = { file = "data/masses_ring_outer.geojson", width = 750.0, h = 0.5, thin = 0.4 } }
# M5: Kokyo Gaien (the palace's outer garden: the plaza before the Imperial Palace) is raked gravel round its lawns and
# black pines; OSM maps the lawns (18 landuse=grass, 14.6 ha of the way's 31 ha) and the pine woods inside it, so the
# park is gravel less those (engine gravel_parks, Paris's Tuileries)
gravel_parks = ["皇居外苑"]
# M5: surface car parks inside parks drawn on the asphalt layer, not the lawn (engine opt-in, Singapore's)
lots_off_green = true

[roads]
margin = 1000
lane_w = 3.25               # Japanese urban lanes 3.0-3.5 m (道路構造令: 3.25 m on class 4 roads)
# (M3) footways on bridges: the pedestrian decks over Shinjuku's and Shibuya's streets (歩道橋), the Rainbow Bridge's
# promenades, the Sumida's footbridges (Sakura-bashi); tunnels and layer < 0 (the Yamate tunnel, the subways, the
# Shuto's underground sections) are never drawn
footbridges = true
# (M3) the Rainbow Bridge (東京港連絡橋, 1993): the Shuto's Daiba line on the upper deck, the general road, the
# Yurikamome and the promenades on the lower; 52 m navigational clearance under the girder [believed: JA Wikipedia].
# OSM puts them at layers 4 and 3 (31.5 m and 16-24 m): the lower deck's roads carry no name, the Yurikamome only
# the line's, so they are listed by id (engine opt-in span_ways). The Shibaura loop (layer 2) climbs to them
decks = { "東京港連絡橋" = { deck = 60.0, lower = 52.0 } }
# (M3 fix round) minor ground roads, and with them street trees and cars, end 50 m beyond the districts and the gaps'
# masses (engine opt-in built_only); the trunk roads run on to the 1 km margin (M3 critic: a pale halo of streets on
# bare ground stopping on a rounded outline)
built_only = { margin = 50.0, keep = ["motorway", "motorway_link", "trunk", "trunk_link", "primary", "primary_link"] }
span_ways = { "東京港連絡橋 lower" = [4848879, 316305913, 275936305, 749205417] }

[markings]
# M5: Japan's markings (道路標識、区画線及び道路標示に関する命令): every signalled junction arm a zebra (横断歩道: 0.45 m bars
# and gaps, 4 m) and a stop line (city.json zebra.atSignals); an arm without signals on the lesser road a stop line
# (止まれ, city.json giveWay "stop"); OSM's crossings between junctions zebras too, without the UK's zig-zags, give-way
# lines or beacons; the cycle lanes OSM maps as lanes (自転車専用通行帯, 387 ways) painted blue along the kerb
junctions = "signals"
