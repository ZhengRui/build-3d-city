# Central Tokyo: Phase 0's option D, the core (Marunouchi and the Imperial Palace, Ginza, Nihonbashi, Tsukiji and
# Shiodome, Toranomon and Azabudai, Tokyo Tower, Roppongi and Akasaka, Tsukishima-Kachidoki-Harumi, the Sumida to
# its centreline, Rainbow Bridge and Daiba) with two islands: Asakusa and the Skytree, and Nishi-Shinjuku, the
# Meiji Shrine and Shibuya. Every city-specific setting of the build-3d-city pipeline; the engine
# (.agents/skills/build-3d-city/engine/pipeline, its README lists every key with its default) and the region preset
# "china-south" hold the rest. Run a stage with `uv run city3d <stage>` from this folder, everything with
# `uv run city3d all`.

name = "tokyo"
title = "Tokyo"
# Tokyo's own preset (M4): its facade styles and rooftop programmes (presets/jp-tokyo.toml, jp_tokyo/), china-south's
# other tables (species, cars, road widths) under them
preset = "jp-tokyo"
# M4 landmark figures (scripts/m4l_structures.py): Tokyo Tower, the Skytree, Rainbow Bridge, Docomo's spire, the
# Diet's tower, Tokyo Station's domes, Sensō-ji's pagoda, hall and gate, ...
# (M4 fix round) the sign streets' projecting vertical signs (scripts/m4f_signs.py)
include = ["generated/structures-m4l.toml", "generated/structures-m4f-signs.toml"]
# UTM 54N (central meridian 141 E; Tokyo is 1.2 degrees west of it: scale 0.99978). PLATEAU is JGD2011 lat/lon
# (EPSG:6697 with heights, 6668 2D), which PROJ relates to WGS 84 by a null transformation (JGD2011 is ITRF2008:
# sub-metre); the GSI DEM mosaic is web mercator (EPSG:3857) and is warped as it loads
utm_epsg = 32654
coast = true                # Tokyo Bay: the coastline of OSM cuts the ground; the Sumida and the canals are tidal
drive = "left"
# metres per storey for OSM building:levels: Tokyo's offices 3.8-4.2 m, its mansions 2.9-3.1 m, the 雑居ビル
# between; M2: 3.5 (PLATEAU 3.45-3.56 m a storey from 3 to 12 storeys, checks/m1_sources.md §5; only OSM fill uses it)
level_h = 3.5
user_agent = "city3d (you@example.com)"
# The local Overpass first (the user's Docker container on 8787, built from BBBike's Tokyo extract of 3 Oct:
# 139.62-139.95 E, 35.56-35.78 N); while it is down the connection is refused and the public mirrors answer (slow,
# 429/504: the engine retries and caches every answer in raw/)
overpass = ["http://127.0.0.1:8787/api/interpreter", "https://maps.mail.ru/osm/tools/overpass/api/interpreter",
    "https://overpass-api.de/api/interpreter", "https://overpass.kumi.systems/api/interpreter",
    "https://overpass.private.coffee/api/interpreter"]

[osm]
# by each district's clip box, not Overpass area(): a fresh local Overpass may have no area data (Berlin's had
# none), and the clip box is small anyway
area = false
# (M2) underground=yes, location=underground|indoor and level < 0 outlines are not buildings (station concourses,
# malls under the streets); only OSM fill (where PLATEAU has nothing) could build them
underground_drop = true

# The user's boundary (6 Oct 2026, "all D"; the Phase 0 boundary note, plans/maps/tokyo.json):
# three pieces (the core, the Asakusa-Skytree island, the west island) drawn by hand in Phase 0 and snapped in M1 to
# the streets, rivers and railways by scripts/snap_boundary.py: OSM's blocks inside the drawn line by more than half
# their area, big faces (the bay, the Sumida, the palace grounds) cut along it, so the Sumida's centreline stays where
# the line follows the river; M3 carried the west island's edge along Omotesando (scripts/m3_omotesando.py).
# Boundary change (the user, 6 Oct 13:45: "Tokyo deserves to be the heaviest"): the two gaps between the core and the
# islands are real buildings too, Phase 0's gaps.json rings snapped to blocks by the same rule and joined to D
# (scripts/m3g_boundary.py, D as M3 left it in data/boundary_d_m3.geojson): one district area of 56.45 km², 49.11 km²
# of land (D as M3 left it: 40.28 / 33.47): the Asakusa gap (Akihabara, Kanda, Asakusabashi, Kuramae; +8.52 km²) with Ueno's south
# to the station and Ameyoko (+0.96) and Kanda Myojin's block, the west gap (Yotsuya, Shinanomachi, Aoyama, Jingu
# Gaien, Shinjuku Gyoen; +6.84 km²) with CO·MO·RE Yotsuya's block. data/boundary_d.geojson is the area (one polygon),
# checks/boundary.png the picture.
# Each ward (admin_level 7) is a district clipped by the area: its clip is the Feature of that name in
# data/boundary_districts.geojson (the area cut by the ward buffered 25 m; Koto's three parts are Toyosu's and
# Harumi's water edges). Shinagawa's 0.12 km² at Higashi-Yashio (Odaiba) and Bunkyo's 0.05 km² at Yushima (the
# Asakusa gap's west edge) are in it too
[districts]
"Chiyoda" = { relation = 1761742, clip = "data/boundary_districts.geojson" }
"Chuo" = { relation = 1758897, clip = "data/boundary_districts.geojson" }
"Minato" = { relation = 1761717, clip = "data/boundary_districts.geojson" }
"Koto" = { relation = 3554015, clip = "data/boundary_districts.geojson" }
"Taito" = { relation = 1758888, clip = "data/boundary_districts.geojson" }
"Sumida" = { relation = 1758891, clip = "data/boundary_districts.geojson" }
"Shinjuku" = { relation = 1758858, clip = "data/boundary_districts.geojson" }
"Shibuya" = { relation = 1759477, clip = "data/boundary_districts.geojson" }
"Shinagawa" = { relation = 3554304, clip = "data/boundary_districts.geojson" }
"Bunkyo" = { relation = 1758878, clip = "data/boundary_districts.geojson" }

[sun]                       # mid-October: clear autumn air, leaves still green (city.json's sun.date)
latitude = 35.68
declination = -8.5

[sources]
# PLATEAU 2025 is the primary layer (every building, surveyed measuredHeight; checks/m1_sources.md); OSM fills what it
# lacks and lends names and building:parts
footprints = ["plateau", "osm"]
heights = ["landmark", "plateau", "osm_height", "osm_levels", "default"]
dem = "geotiff"             # GSI DEM5A, 5 m bare earth (laser), m above Tokyo Peil (T.P.)
# (M3 fix round) the backdrop from GSI's 10 m bare-earth DEM (dem_png z12, ~31 m, raw/gsi_backdrop/), GLO-30 only
# where GSI has nothing (the sea, beyond Japan's tiles): GLO-30, a surface model, drew the western plain's roofs and
# trees as lumpy hills (M3 critic)
backdrop = "geotiff"

# PLATEAU 2025 CityGML (MLIT, PDL 1.0), raw/plateau/README.txt: one bldg GML per 1 km mesh and ward (142 files, 80
# meshes; a border mesh is served by each ward: the adapter dedupes by gml:id) from the PLATEAU data catalog API,
# fetched by w-tokyo-data. The citygml adapter's PLATEAU flavour (in the engine): lat/lon/h order,
# LOD1-only buildings from lod1Solid / lod0RoofEdge, the appearance block cleared, codelists resolved
[sources.plateau]
adapter = "citygml"
flavour = "plateau"
path = "plateau/bldg/*_bldg_6697_op.gml.gz"
crs = "EPSG:6668"           # JGD2011 lat/lon (srsName 6697 = 6668 + JGD2011 heights)
label = "PLATEAU"
role = "primary"
# m above the building's ground (M2): a LoD2 solid's (or roof level's) own roof top; a LOD1-only solid's
# measuredHeight, else its block's top. measuredHeight runs low on towers (Midtown 224.6 where the LoD2 roof is 245.8
# and the list 248.1; the Metropolitan Government 226 / 243.05 / 243.4; Scramble Square 220 / 229.0 / 229.7) and
# takes masts on others (TEPCO's head office 200.6 over a 110 m LoD2 roof, J-Power 149.7 / 70.4, the Fire
# Department 110 / 62.9); a LOD1-only solid's measuredHeight (its block's top is a median, 1.8 m under it). Towers over
# big low LOD1 blocks (NHK) are capped one by one in [buildings] fix_h (scripts/m2_fixes.py), not by a rule: a
# rule flattened 49 real towers (critic round 1: Sumida City Hall, Sophia University)
# A LOD1 solid of 1,500 m² or more: measuredHeight is its highest point over the whole footprint (the Yoyogi Gymnasium
# 29.8 m over 14,822 m², its solid 17): its own top, raised to its storeys x 4.5 where measuredHeight goes that high
# (Sumida City Hall: 19 F, 85.5 m; NHK: 8 F, 36 m) (critic round 2)
height = """where(lod == 2, roof_top_z - ground_z, where(isnan(measuredHeight), roof_top_z - ground_z,
    where(area >= 1500, maximum(roof_top_z - ground_z, where(isnan(storeysAboveGround), 0,
    minimum(measuredHeight, storeysAboveGround * 4.5))), measuredHeight)))"""
# a tower and its podium are one PLATEAU Building (Roppongi Hills 22,800 m² from one 235 m top, Midtown 15,500 m²,
# Mori JP 10,700 m²): each LoD2 solid is cut by roof level (the adapter's roof_split, M2), defaults
# (levels within max(3 m, 5 % of their height) are one; levels and slivers narrower than 3 m, which 04's strip rule
# would drop, go to their neighbour)
roof_split = { min_area = 300.0, rel_tol = 0.05, min_width = 3.0 }
keep = ["gml_id", "parent_id", "part", "lod", "fp_from", "name", "usage", "usage_name", "class", "class_name",
    "detailedUsage", "detailedUsage_name", "buildingStructureType_name", "storeysAboveGround", "storeysBelowGround",
    "lod1HeightType", "buildingID", "measuredHeight", "roof_top_z", "eave_z", "roof_area", "n_roof", "n_wall", "tile",
    "roof_level", "roof_levels"]
rename = { ground_z = "ground_elevation" }    # T.P., the GSI DEM's datum: 03_compare checks it
drop = { class = ["3003", "3004"] }

[sources.geotiff]           # GSI DEM5A (GSI terms of use), raw/gsi_dem/README.txt
# w-tokyo-data's mosaic of the dem5a_png z15 tiles over the ground area, web mercator; the tiles' voids (water) are
# nodata, filled from GLO-30 by 05a_terrain where the backdrop meets them
ground = ["gsi_dem/gsi_dem_mosaic.tif"]
backdrop = ["gsi_backdrop/gsi_z12_mosaic.tif", "Copernicus_DSM_COG_10_N35_00_E139_00_DEM.tif",
    "Copernicus_DSM_COG_10_N35_00_E140_00_DEM.tif", "Copernicus_DSM_COG_10_N36_00_E139_00_DEM.tif",
    "Copernicus_DSM_COG_10_N36_00_E140_00_DEM.tif", "Copernicus_DSM_COG_10_N35_00_E138_00_DEM.tif",
    "Copernicus_DSM_COG_10_N36_00_E138_00_DEM.tif"]   # (M7: E138, Mount Fuji's and Chichibu's sector)
bare = true
note = "GSI DEM5A (基盤地図情報 数値標高モデル 5m, laser survey) from the GSI elevation tiles dem5a_png z15, mosaicked in EPSG:3857, metres above T.P. (Tokyo Peil, ~mean sea level of Tokyo Bay). Beyond it Copernicus GLO-30 (1 arc-second, EGM2008): a surface model, roofs and trees included."

[sources.copernicus]
# the ground area plus 40 km: 35.2-36.2 N, 139.2-140.3 E; (M7) E138: Mount Fuji's sector, Tanzawa, Okutama, Chichibu
tiles = ["N35_00_E139_00", "N35_00_E140_00", "N36_00_E139_00", "N36_00_E140_00", "N35_00_E138_00", "N36_00_E138_00"]

# The building table (04_buildings, M2): PLATEAU's footprints and heights wherever it has a building, cut by roof
# level ([sources.plateau] roof_split); OSM fills only where PLATEAU has nothing, below fill_max_h (20 m) or
# untagged under 300 m² (a taller OSM-only building is a site PLATEAU's survey saw empty or under construction)
[buildings]
# canopies, building sites, bridges, boats: never extruded (OSM's construction sites at Toranomon, Azabudai, Yaesu,
# Shibuya and Tokyo Torch are towers that do not stand yet)
osm_skip = ["roof", "carport", "shelter", "bridge", "construction", "ship", "boat", "ruins", "no"]
station_untagged = "drop"   # untagged train_station / transportation outlines: the Metro's concourses
split_ground = true         # each roof level stands on its own ground (Roppongi, Akasaka, Toranomon are hills)
own_ground = true           # PLATEAU's solids stand on their own ground (never nested on a taller piece's roof)
volume_dedupe = true        # OSM fill drawn into a PLATEAU solid is clipped
# OSM's heights reach a footprint from an OSM building of up to this size, and big untagged halls are no estates
osm_max_area = 20000
# Generated by scripts/m2_fixes.py --toml (the reasons per id in checks/m2_fixes.md): OSM outlines PLATEAU leaves
# out (the government quarter, Kamiyacho Trust Tower, TODA BUILDING), OSM outlines on broken LOD1 solids (Hotel New
# Otani) and OSM tower outlines over PLATEAU's construction stubs (Azabudai Residence B, World Tower Residence) are
# built whatever fill_max_h says (heights: OSM's height, else levels x 3.5, else set_h, else 3 storeys); set_h: kept
# outlines without a height; fix_h: LOD1 towers over big low blocks (NHK) and lone roof levels (masts as prisms)
# BEGIN m2_fixes (scripts/m2_fixes.py --toml; the reasons in checks/m2_fixes.md)
keep = { osm = ["r1902643", "r19290024", "r1964472", "r1964562", "r1967902", "r1968066", "r1990754", "r2034771", "r2362078", "r3361370", "r4152284", "r4169294", "r5415359", "r7825626", "r7826113", "r8244681", "w1031369140", "w1068696339", "w1073294162", "w1123118746", "w1134396779", "w1135849069", "w1158721027", "w1158739445", "w1158977078", "w1169516010", "w1169517945", "w1181055646", "w1192782680", "w1194276621", "w1201770129", "w1201770130", "w1211910332", "w1212154884", "w1218483839", "w122343572", "w1228833079", "w1230247562", "w128248384", "w128248385", "w1315534414", "w1318933998", "w1321832502", "w1321832512", "w1322002388", "w1322002389", "w1322157808", "w1333155344", "w1339017340", "w134971942", "w1353054272", "w1357107799", "w135739169", "w135739170", "w135739171", "w135838612", "w136050249", "w136050250", "w136050308", "w1366974172", "w1375153693", "w1375153694", "w1375153695", "w1375153696", "w1375153697", "w1375153698", "w1375153699", "w1375153700", "w1375153701", "w1375153702", "w1375153703", "w1375153704", "w1375153705", "w138522543", "w138671585", "w138871295", "w138910704", "w139078638", "w139086551", "w1394178898", "w139503265", "w139953279", "w139953328", "w139983211", "w140096038", "w140096040", "w140096044", "w140096047", "w140096048", "w140096053", "w140096055", "w140096057", "w140099035", "w140099051", "w140109067", "w140109074", "w140109075", "w140109076", "w140109079", "w140109080", "w140109081", "w140109083", "w140109086", "w140109089", "w141296986", "w1415418652", "w1416539680", "w1416539681", "w1416539683", "w1416539684", "w1416539686", "w1423463429", "w1427113750", "w143359606", "w143359607", "w143359637", "w143359719", "w144483533", "w144483547", "w144483563", "w144483604", "w1447149804", "w1447149806", "w1448344708", "w144852545", "w144866207", "w145096334", "w145108372", "w145108375", "w145108387", "w145108403", "w145108404", "w145108407", "w145108408", "w145108411", "w145108412", "w145108425", "w145115283", "w145115285", "w145115287