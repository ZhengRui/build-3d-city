[shores]
# (M3) Odaiba Kaihin Koen's beach and the bay's revetments: everything seaward of the edge fitted into 3 m (beach) and
# 7 m (revetment), the shader's across coordinate kept (Singapore M3: the sand glowed 10-20 m into the water); small
# closed coast loops (breakwater islets, the Daiba batteries' rims) are revetment, not sand
water_side = { beach = 3.0, revetment = 7.0 }
islet_max = 120.0
islet_type = "revetment"
quay_walls = true           # the Sumida's, the canals' and the moats' walls as vertical faces ([terrain] quay_walls)

[terrain]
far_reach = 40000.0         # Yokohama, Kawasaki and the Chiba shore of the bay
# (M7, engine opt-in) the reach per side [west, south, east, north]: Mount Fuji 98 km west-south-west of Tokyo Tower,
# Tanzawa (50-65 km), Okutama and Chichibu (60-90 km) to the west; the Boso hills (Nokogiri-yama, Kano-zan) across the bay
# to the south-east; Tsukuba (60 km) to the north-east. The GLO-30 tiles end at 35.0 N (Izu and Oshima are left out)
far_reach_sides = [105000.0, 55000.0, 40000.0, 65000.0]
back_error = [6.0, 35.0]       # (the far mountains: 35 m over the TIN at 40 km and beyond)
# (M7, engine opt-in) the zero-metre lowlands (Katsushika, Edogawa, Koto's east: -1 to -3 m T.P. behind the levees) are
# land: the sea only where GSI's tiles are void (and GLO-30 fills them at sea level); they were the sea's -3 m and the
# sea plane showed through them as blue blob "lakes" across the far north-east plain (M6 critic, item 6)
back_sea = "void"
# (M7, engine opt-in) the earth's curvature on the backdrop past 12.5 km from the origin (the ground area's corners lie
# within it): Fuji stands ~3,300 m over the plain as seen from the city, not 3,776 (24 % too tall without it)
curvature = { from = 12500.0, k = 0.13 }
back_peaks = true           # Fuji pinned at its surveyed height (the 200 m average takes ~40 m off the crater rim)
# (M7, engine opt-in) Fuji's cap in mid-October (sun.date 10-15): a first snow on the summit cone from ~3,100 m, patchy
snow = { from = 3050.0, full = 3400.0, rgb = [228, 232, 238], patchy = 0.6 }
cover_cell = 60.0           # the outer map 60 m a pixel over the 160 x 120 km backdrop (at 50 m it was 3,300 x 2,400)
# (M3) GSI DEM5A is bare earth in T.P. (~ the bay's mean sea level): the default sea knee (everything under 3 m to 0,
# 5 m off the rest) would flatten Marunouchi, Ginza and the reclaimed piers (3-6 m T.P.) to the sea. Ground under
# 0.5 m T.P. is the scene's 0 (1 m over the drawn sea at -1), the rest keeps its relief less ~1 m. The lowlands below
# T.P. (Sumida's Oshiage and Mukojima, Koto: -1 to -3.5 m, behind the levees) are real but would lie under the sea
# plane: they stand at 0, the levees and seawalls at their own height
sea_drop = 0.5
sea_knee = 0.5
# the piers and seawalls drop to the sea within a short ramp (10 m flat at the edge, 60 m ramp), not 200 m: Tokyo's
# reclaimed land meets the bay at quays and seawalls 3-6 m over it, not at beaches
coast_flat = 10.0
coast_ramp = 60.0
# the Sumida's and the canals' embankments and the palace's moat walls, a 5 m bare-earth DEM (Paris's lidar settings):
# no flat band and long ramp round the water (they levelled the Sumida's kamisori walls to the river over 25 m and
# ramped them over 90 m), the cells by a wall the quay's, not the water's, the TIN held within 0.5 m by the water;
# quay_walls: the step from the water to the quay in one cell, which 05e_shores covers with a vertical wall
water_flat = 0.0
water_ramp = 5.0
water_all_touched = false
tin_error_bank = 0.5
quay_walls = true
# the tidal waters at the sea's 0 (engine opt-in, M3): the 5 m DEM reads 0.5-2.5 m over them (the Sumida body 0.91,
# the Keihin canal 1.10), ~2 m over the bay at their mouths. A point in each body (checks/terrain.md's water levels)
water_levels = { "Sumida and the Chuo canals" = [139.79356, 35.69193, 0.0], "Keihin canal" = [139.75262, 35.62384, 0.0], "Ariake and Shinonome canals" = [139.78096, 35.63283, 0.0], "Hamarikyu and the Tsukiji river" = [139.77189, 35.65214, 0.0] }
edge_land = true            # the ground area's edge cells take the land of the cells inside (Singapore M3's pyramids)
dem_window = true           # each DEM run warped over the grid it fills, from a temporary tiled GeoTIFF
# GLO-30 reads 0.7 m under GSI's T.P. by median over the bay (checks/m1_sources.md): the backdrop let up by it, so
# its sea is 0 again and the coast is where it crosses the sea plane
back_shift = 0.7            # (GSI's land, T.P. already, is raised 0.7 m with it: within the backdrop's 6 m error)
# GSI's pit of -10 m at 35.6222 N 139.7700 E (by Odaiba, a tunnel approach or a dug site) and any like it: dry cells
# under -5 m T.P. seed a pit, re-filled from its outline (the lowlands reach -3.5 m; nothing real is under -5 m)
pits = { below = -5.0, grow = 2.0, window = 150.0 }
# (tk2, the user 8 Oct: the Sumida bridges' approaches dropped from the deck's end to the river's levelled ground, Kiyosu
# west 1.6 m over a -2.8 m node, Kachidoki's 2.6-3.1 m ends over -1.5 and 0.4 m: the 5 m DEM's cells at the abutments
# are the quay wall's foot) bridge abutments (engine opt-in): the ground under a road deck's end raised to the road it
# meets, so the deck ends on it and the approach runs on level; at the highest dry ground within 20 m along the roads
# (level "high", reach 20 m: Kachidoki's west ends lie on the quay's edge, the TIN's slope from the 2.9 m street down to the
# quay wall's -6 m foot under the road's first 12-15 m, where the fitted line and a 12 m reach ended the decks at -1.4 and 0.5 m)
# (audit, 8 Oct: of the 2,338 deck ends 156 rose over 4 m at the node, the largest 10.3 m (Nijubashi over the palace moat),
# all layer-1 road bridges over moats and canals whose node had read the quay wall's foot; no expressway or ramp end (an
# elevated way meets a ground road only at its foot). Ground TIN 59.7k -> 91.4k triangles: settled and drag ms within
# 2 % of the old ground (speedtest --quick, WebGPU))
deck_ends = { level = "high", reach = 20.0 }
