"Kronprinzenbrücke" = { spans = 3, fascia = 1.2, type = "girder", body = "#d4d6d2", piers = "#d4d6d2" }
"Lutherbrücke" = { spans = 3, fascia = 1.4, type = "stone", rise = 0.22 }
"Lessingbrücke" = { spans = 3, fascia = 1.2, type = "stone", rise = 0.2 }
"Michaelbrücke" = { spans = 3, fascia = 1.4, type = "concrete", rise = 0.08 }
"Mühlendammbrücke" = { spans = 3, fascia = 1.6, type = "concrete", rise = 0.06 }
"Friedrichsbrücke" = { spans = 3, fascia = 1.2, type = "stone", rise = 0.22 }
# (M5 fix round) the Landwehrkanal's Admiralbrücke (1882): iron beams on granite abutments, its cast-iron railings
"Admiralbrücke" = { spans = 1, fascia = 0.8, type = "girder", body = "#5d625e", piers = "#a49c8c" }
"Schloßbrücke" = { spans = 3, fascia = 1.2, type = "stone", rise = 0.22 }
