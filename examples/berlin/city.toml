[quality]                   # 04b_quality's height checks: the Umweltatlas (h_umwelt) and the storeys it lends
second = "umwelt"
storeys = "geschosse"
storey_min = 2.5

[ground]
town = true                 # the Bezirke beyond the boundary: a painted roofscape, not bare paving
# M3 (London's settings): the Bezirke's buildings over the 4 km ground margin raised as block masses (06e_masses).
# Their footprints are the Umweltatlas's (town_buildings.gpkg, 287,191 with heights, copied from
# town_buildings_umwelt.gpkg in 06e_masses' schema), which cover the ground area and no more: no reach into the
# backdrop (a larger reach would make 06e_masses fetch OSM's instead); the WorldCover map carries the town on
masses = true
masses_reach = 0.0
masses_houses_far = true
# (M7 fix round) the Umweltatlas's towers and masts are no blocks: the Funkturm stood as a fat windowed mass (its lattice
# is city.json's masts)
masses_skip = { funktion = ["Mast", "Sende-, Funkturm, Fernmeldeturm"] }
# the Spree is held by the Mühlendamm lock (upper pool ~32.3 m, lower ~31.5 m), the Landwehrkanal by its Ober- and
# Unterschleuse, the Spreekanal and the harbours by theirs: OSM's lock gates and weirs split the water, each pool
# levelled on its own
pools = true
# the parks' paths (the Tiergarten's, Treptower Park's, the Volkspark Friedrichshain's), pedestrian areas cut out
# whole, stone and asphalt squares as their own layers (Alexanderplatz, Pariser Platz, the Potsdamer Platz's)
paths = { footway = 2.6, path = 2.0, cycleway = 2.6, bridleway = 3.0, steps = 2.5, pedestrian = 4.0 }
paved = true
green_min_width = 3.5
path_relations = true
green_off_water = true
path_layers = true
# the Zoologischer Garten (tourism=zoo, not a park in OSM): lawn ground and wooded like a park (M3 fix round)
[ground.green]
tourism = ["zoo"]

[roads]
lane_w = 3.25               # German urban lanes 3.0-3.5 m (RASt 06)
footbridges = true          # the Monbijou footbridges, the Marie-Elisabeth-Lüders-Steg, the Landwehrkanal's Stege
decks_ref = "water"         # the named decks count from the water under them
decks_level = true          # ... from its level (the ground beside the quay walls lies 6 m under it; engine option)
# the Stadtbahn (S-Bahn and regional trains through Mitte) runs on brick arches the LoD2 keeps as a structure at
# 7-9 m (51009_1750, checks/buildings.md): at the default 7.5 m the tracks would run through the arches' tops
rail_layer_h = 9.5
# The Spree's bridges: the deck's height over the water (the upper pool 32.3 m, the lower 31.5). Berlin's Spree
# bridges give 4.0-4.5 m headroom (the Bundeswasserstraße's clearance through the city), the deck 1-1.5 m deep; the
# quays stand 2-3 m over the water, so the decks rise a little to their spans. The U1 crosses the Oberbaumbrücke on
# its upper deck (its ways carry no bridge:name: the key "U1" matches their name): 8 m over the street on its
# Kreuzberg steel viaduct, and over the river 8 m over the highest ground within 80 m along it (the banks), ~4 m
# over the road deck. The Stadtbahn ("Berliner Stadtbahn", every elevated way of it, whatever its layer: OSM's
# layers 2-3 where it crosses roads and the Spree had put it 25 m up at Jannowitzbrücke) 7.0 m over the highest
# ground within 80 m along it, level over the Spree from its banks: at 9.5 m its tracks ran a median 2.8 m over the
# LoD2's arches (checks/clearance.md)
decks = { "Oberbaumbrücke" = 6.5, "U1" = { deck = 8.0, reach = 80.0, level_on = "Oberbaumbrücke" }, "Berliner Stadtbahn" = { deck = 7.0, reach = 80.0 }, "Weidendammer Brücke" = 5.5, "Monbijoubrücke" = 5.0, "Moltkebrücke" = 6.0, "Marschallbrücke" = 5.5, "Jannowitzbrücke" = 6.0, "Schillingbrücke" = 6.0, "Elsenbrücke" = 6.5, "Kronprinzenbrücke" = 6.0, "Lutherbrücke" = 5.5, "Lessingbrücke" = 5.5, "Michaelbrücke" = 6.0, "Mühlendammbrücke" = 5.5, "Rathausbrücke" = 5.0, "Liebknechtbrücke" = 5.5, "Friedrichsbrücke" = 5.0, "Schloßbrücke" = 5.0, "Gustav-Heinemann-Brücke" = 5.5, "Hugo-Preuß-Brücke" = 6.0, "Ebertsbrücke" = 5.0, "Eiserne Brücke" = 5.0, "Moabiter-Brücke" = 5.5, "Gotzkowskybrücke" = 5.5, "Hansabrücke" = 5.5, "Schlesische Brücke" = 5.0, "Humboldthafenbrücke" = 7.0, "Admiralbrücke" = 3.2 }
# (M3 fix round) the Stadtbahn's Humboldthafenbrücke (2006, concrete arches over the harbour; OSM's relation): drawn
# whole under its tracks (rail_outlines), on piers in the water, not two beams on stick piers
# each named deck's OSM man_made=bridge outline drawn whole with piers in the river, typed from photos (refs/):
# the Oberbaumbrücke's brick arches (its towers are buildings), the Moltkebrücke's, the Lutherbrücke's, the
# Schloßbrücke's and the Friedrichsbrücke's sandstone arches, the Weidendammer Brücke's and the Marschallbrücke's
# iron arches, the post-war concrete and steel girders (Jannowitz, Schilling, Elsen, Michael, Mühlendamm)
bridge_outlines = true
# M3 fix round: the Stadtbahn's unnamed station tracks through the Hauptbahnhof (OSM layer 3: 21-26 m, over the named
# viaduct's 11 m) take the span they join; the tracks laid on the LoD2's viaduct arches (51009_1750) at the arches'
# tops, every 10 m, interpolated over the steel spans between them (up to 80 m), no stick piers inside the arches
rail_join = true
rail_on = { field = "function", values = ["51009_1750"], near = 2.0, gap = 80.0, step = 10.0 }
outline_parts = true
rail_outlines = true
# the Kronprinzenbrücke, the Mühlendammbrücke, the Rathausbrücke carry their streets' names, no bridge:name: their ways
# take the outline's name (engine [roads] outline_names)
outline_names = true
[roads.piers]
# the U1 on its brick arcade along the bridge's north side (the outline's U1 band), level with the road deck's piers
"Oberbaumbrücke" = { spans = 7, fascia = 1.4, type = "stone", rise = 0.25, body = "#9a4e3a", piers = "#8f4835", upper = "U1", arcade = { bay = 4.6, pier = 1.3, wall = 0.9, rise = 0.35, colour = "#9a4e3a" } }
"Weidendammer Brücke" = { spans = 1, fascia = 1.0, type = "iron", rise = 0.1, body = "#3f4a46" }
"Monbijoubrücke" = { spans = 2, fascia = 1.0, type = "stone", rise = 0.25 }
"Moltkebrücke" = { spans = 3, fascia = 1.4, type = "stone", rise = 0.22, body = "#b3a283", piers = "#ab9a7c" }
"Marschallbrücke" = { spans = 3, fascia = 1.2, type = "iron", rise = 0.1, body = "#4b5652" }
"Jannowitzbrücke" = { spans = 3, fascia = 1.6, type = "girder", body = "#7c817e" }
"Schillingbrücke" = { spans = 3, fascia = 1.4, type = "concrete", rise = 0.08 }
