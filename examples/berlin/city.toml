# (M7) the Umweltatlas footprints painted into the 20 m cover map in the town colour: no back-yard tree green under the masses
cover_buildings = true
# the named summits beyond the DGM1 pinned in the backdrop at their surveyed heights (its 200 m cells averaged
# Teufelsberg to 78 m in the scene for 90, the Arkenberge to 64 for 92)
back_peaks = true
# Ground = metres over NHN minus this datum. NOT the default "auto" (the lowest cell): the DGM1 holds cut-and-cover
# tunnels and pits (15.3 m in the Tiergarten tunnel's ramp south of Potsdamer Platz, 6.0 m at Westend; 182 pits
# under 30 m in the ground area, checks/sources.md §7). The DGM1's water surfaces: the Spree's upper pool 32.3 m
