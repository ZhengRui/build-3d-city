# Berlin: the historic core and its neighbours (Ortsteile Mitte, Tiergarten, Moabit, Hansaviertel, Friedrichshain,
# Kreuzberg, Alt-Treptow) and the City West round the Zoo, the Kurfürstendamm and the Gedächtniskirche. Every
# city-specific setting of the build-3d-city pipeline; the engine (.agents/skills/build-3d-city/engine/pipeline, its
# README lists every key with its default) and the region preset "europe-west" hold the rest. Run a stage with
# `uv run city3d <stage>` from this folder, everything with `uv run city3d all`.

name = "berlin"
title = "Berlin"
# Script-written settings, kept out of this file so that a script run does not rewrite (and commit) it again:
# the [[structures]] figures of scripts/*_structures.py, in generated/ (laid under this file in list order, then
# this file's own [[structures]]; see the engine README, `include`)
include = ["generated/structures-m4t.toml", "generated/structures-m4h.toml", "generated/structures-m10f.toml"]
# Berlin's own preset (M4), on europe-west's tables (uk-london's base/replace mechanism): Berlin's facade styles
# (Altbau plaster and stucco with the Berliner Dach, courtyard wings, post-war infill, Plattenbau, Karl-Marx-Allee's
# tiles, the Hansaviertel, Neubau stone, post-war concrete, glass, sandstone, brick, churches), its roof shapes from
# the LoD2's roof types and eaves, its chimney stacks; europe-west's building kinds (M2), roads, trees and cars until
# M5-M6 replace them (data/region_research.md; see README "Region preset")
preset = "de-berlin"
# UTM 33N (central meridian 15 E): Berlin's own grid. Every official Berlin dataset (LoD2, DGM1, the Umweltatlas,
# the tree and lamp inventories) is ETRS89 / UTM 33N, EPSG:25833: the same projection on the ETRS89 datum, which
# PROJ relates to WGS 84 by a null transformation (no grid shift), so EPSG:25833 coordinates come through unchanged
# (the true ETRS89-WGS 84 offset is ~0.8 m in 2026: below every source's error, and all official sources share it).
# The sources are read in 25833 (the citygml adapter's crs, the DGM1's GeoTIFF tags) and warped as they load.
# Berlin is 1.6 degrees west of the zone's centre: scale 0.99997, grid north 1.3 degrees east of true north
utm_epsg = 32633
coast = false               # inland: the Spree and the canals are OSM water polygons; the Baltic is 150 km away
drive = "right"
# metres per storey for OSM building:levels and the Umweltatlas storey counts (geschosse, 88 % of the buildings):
# the Gründerzeit Altbau, 41 % of the buildings, has 3.5-4 m storeys (a 5-storey block 21-22 m to the eaves,
# region_research.md §5.1); Plattenbau 2.8 m, offices 3.6-4.0 m. checks/sources.md §4 measures hoehe / geschosse
level_h = 3.5
user_agent = "3D-Fun berlin reconstruction (hobby project)"
# Local Overpass first: Docker container city3d-overpass-berlin, built from BBBike's Berlin extract of 26 Sept 2026
# (raw/osm/Berlin.osm.pbf, box lon 12.76-13.98, lat 52.23-52.82); if it is down: `docker start city3d-overpass-berlin`
overpass = ["http://127.0.0.1:8793/api/interpreter", "https://maps.mail.ru/osm/tools/overpass/api/interpreter",
    "https://overpass-api.de/api/interpreter", "https://overpass.kumi.systems/api/interpreter",
    "https://overpass.private.coffee/api/interpreter"]

[osm]
# by each district polygon's box, not Overpass area(): the local server's area dispatcher is not running (it answers
# "open64: 2 No such file or directory /db/db//osm3s_areas"); it is not ours to restart, and the public mirrors are
# slow from here
area = false

# The user's boundary (30 Sept 2026, "Core", option A of Phase 0; the Phase 0 boundary note,
# demos/data/phase0/berlin.md): seven Ortsteile (admin_level 10) by relation, and the City West as Phase 0's box
# lon 13.3055-13.3450, lat 52.4960-52.5300 cut by the Ortsteile Charlottenburg and Wilmersdorf (the box reaches
# 1.01 km² into Wilmersdorf south of the Kurfürstendamm, to Lietzenburger Straße and the Ludwigkirchplatz: Phase 0's
# 53.3 km² and the downloaded tiles include it). West edge just west of Adenauerplatz: Schloss Charlottenburg is out
[districts]
Mitte = 16566
Tiergarten = 55750
Moabit = 28339
Hansaviertel = 16567
Friedrichshain = 55763
Kreuzberg = 55765
"Alt-Treptow" = 55762
# Breitscheidplatz and the Gedächtniskirche, the Zoo and Zoo station, the Kurfürstendamm to Adenauerplatz,
# Kantstraße, Savignyplatz, the TU and Ernst-Reuter-Platz, north to the Spree
"Charlottenburg (City West)" = { relation = 110126, clip = [[13.3055, 52.4960], [13.3055, 52.5300], [13.3450, 52.5300], [13.3450, 52.4960], [13.3055, 52.4960]] }
# the Kurfürstendamm's south side between Lietzenburger Straße and lat 52.496 (Phase 0's box)
"Wilmersdorf (north)" = { relation = 55740, clip = [[13.3055, 52.4960], [13.3055, 52.5300], [13.3450, 52.5300], [13.3450, 52.4960], [13.3055, 52.4960]] }

[sun]                       # 10 October, leaves still green (the viewer works its sun out from city.json's sun.date)
latitude = 52.5
declination = -6.8

[sources]
# The official LoD2 first (M1, checks/sources.md): the cadastre's footprints (ALKIS), one solid per building or
# building part, roofs and heights from the 2021 laser scan; 2.5-3 x as many buildings as OSM. OSM fills what it
# lacks (buildings since the cadastre's footprints) and gives names and building:parts; the Umweltatlas layer is
# the same footprints in 2D (joined by gml_id) and fills nothing: it lends storeys, names and the function's text
footprints = ["lod2", "osm", "umwelt"]
# the hand-checked landmark list, the LoD2's measured heights (highest roof point over the building's ground), the
# Umweltatlas's (the same laser heights, where a footprint has no LoD2 solid), then OSM's tags. Why: checks/sources.md
heights = ["landmark", "lod2", "umwelt", "osm_height", "osm_levels", "default"]
dem = "geotiff"             # Berlin DGM1 (1 m bare earth, laser scan 2021), m above NHN
backdrop = "geotiff"        # Copernicus GLO-30 (a surface model: +4 m on the DGM1 by median) beyond

[sources.lod2]              # Berlin LoD2 CityGML 1.0 (dl-de/zero-2.0), raw/lod2/README.txt
adapter = "citygml"         # sources/citygml.py: parsed tile by tile, footprints = the GroundSurfaces
# 123 1-km tiles: every tile meeting the boundary buffered by 1 km (79 meet the boundary)
path = "lod2/LoD2_*.zip"
crs = "EPSG:25833"          # srsName urn:adv:crs:ETRS89_UTM33*DE_DHHN2016_NH: ETRS89 / UTM 33N + NHN (DHHN2016)
label = "LoD2"
role = "primary"
# m: highest roof point minus the solid's (flat) ground z, from the 2021 laser scan (DatenquelleDachhoehe 5000)
height = "measuredHeight"
keep = ["gml_id", "parent_id", "part", "function", "roofType", "name", "ground_z", "roof_top_z", "eave_z",
    "roof_area", "n_roof", "n_wall", "fp_from", "tile", "Grundrissaktualitaet", "DatenquelleDachhoehe"]
rename = { ground_z = "ground_elevation" }    # the solid's ground (m NHN), for 03_compare's check against the DGM1

[sources.umwelt]            # Umweltatlas Berlin, Gebäudehöhen (dl-de/zero-2.0), raw/buildings_heights/README.txt
adapter = "file"
path = "buildings_heights/gebaeudehoehen_bbox.geojson"
crs = "EPSG:25833"
label = "Umweltatlas"
role = "fill"
height = "hoehe"            # m above ground: the LoD2's laser roof height (one per footprint, 0.1 m steps)
keep = ["gml_id", "gisid", "name", "funktion", "funktion_txt", "role_txt", "dachart", "dachart_txt", "geschosse",
    "grundrissaktualitaet"]
lend = ["geschosse", "funktion_txt", "dachart_txt"]

[sources.geotiff]           # Berlin DGM1 (dl-de/zero-2.0) and Copernicus GLO-30 (raw/dgm1, raw/backdrop READMEs)
# 81 2 x 2 km tiles over the boundary + 4 km; their GeoTIFF tags carry the ESRI PCS name "ETRS89 / UTM zone 33N"
# but no EPSG GeoKey: GDAL resolves it to EPSG:25833 (checked with rasterio), so nothing needs setting
ground = ["dgm1/dgm1_33_*_2_be_2025.tif"]
backdrop = ["backdrop/Copernicus_DSM_COG_10_N52_00_E012_00_DEM.tif", "backdrop/Copernicus_DSM_COG_10_N52_00_E013_00_DEM.tif"]
bare = true
note = "Berlin DGM1: 1 m bare earth from the 2021 laser scan (ATKIS DGM1, Senatsverwaltung für Stadtentwicklung, Bauen und Wohnen; dl-de/zero-2.0), metres above NHN (DHHN2016), 2 x 2 km GeoTIFF tiles in EPSG:25833 over the boundary + 4 km. Beyond it Copernicus GLO-30 (1 arc-second, EGM2008): a surface model, ~4 m over the DGM1 by median (buildings and forest)."

[buildings]
# M2 (checks/buildings.md, quality.md). The LoD2's solids are the table: one per Building or BuildingPart, all
# standing on the ground (their parts tile the building's footprint: no stacking needed), each at its laser
# measuredHeight. OSM's building:parts only for the few buildings the LoD2 gets wrong (parts_in)
parts = true
parts_in = [
    # (M4 builder H: the Fernsehturm's OSM parts w556435241 and the Siegessäule's w718035022 are no longer used: both
    # are [[structures]] figures, scripts/m4h_structures.py, and their outlines are excluded below)
    "w1214009386",          # Upbeat (Moabit, 2025; the LoD2 lacks it): its parts 21, 44.5 and 82 m, not its 2,905 m²
                            # outline at 82 (fix round)
    "w22989918",            # Atrium Tower: 7-30 levels (the LoD2's generalised roof, roofType 9999: 55 m for 106)
]
# OSM buildings built over the LoD2 (it is clipped round them): towers since its 2021 scan, and the landmarks above
# whose LoD2 solids are wrong
keep = { osm = ["w22989918", "w1364133390", "w1335157930", "w1214009386"] }
# EDGE East Side Tower (2023, 142 m), The Berlinian (topped out January 2026, 146 m), Upbeat (Moabit, 2025, 82 m):
# OSM's outlines, at the list's heights
# no split of LoD2 solids along OSM buildings (the preset's, for BD TOPO's joined towers and podiums): the LoD2 has
# its own parts and a laser height per solid; split replaced 37 of them by OSM's outlines at the Umweltatlas's height
split = { min_n = 1000000 }      # (off: a city.toml table merges into the preset's, so {} would keep it)
# the Fernsehturm's two LoD2 solids (its shaft to 253 m, and a 763 m² prism to 229 m round the sphere): its OSM parts
# and its mast's four thin OSM parts (1-7 m², 264-374 m: under min_piece the lower three went and left the top
# floating), drawn instead as one 26 m² mast from its 256-264 m part raised to 368 m (osm_fix)
# (and, M3 fix round, the Jakob-Kaiser-Haus's 6,352 m² basement between its houses, 4.3 m from the sunken courts' floor:
# a dark roof slab at the street's level; the ground over it re-filled as [terrain] patches)
exclude = { gml_id = ["DEBE3DhqsGtrFsGv", "DEBE3DTptoJUMc8e", "DEBE3DsO9RhopAvB",
    # M4 (builder T): the Sony Center's tent as 50 LoD2 canopy solids 8-24 m thick at 34-68 m (a [[structures]] figure
    # instead, scripts/m4t_structures.py), the HKW's shell roof as a 1,482 m² box at 14-24 m (likewise), and a
    # construction-era 740 m² canopy slab at 37-42 m by the Berlinian (the Galeria's corner, 2021 scan)
    "DEBE3DiiU6EaJSRb", "DEBE01YYK0001z2r",
    "DEBE3DRowA5hQCj1", "DEBE3DR0HEmXToaS", "DEBE3DEFymWchfNx", "DEBE3DcZdidMFUlR", "DEBE3DSdr81jYxyl", "DEBE3DAlHqqxD8E0",
    "DEBE3DaTKGffCwdi", "DEBE3DhuKxV0Hd9v", "DEBE3DNFim45RMKJ", "DEBE3DpzMloy0UAh", "DEBE3DfHDiOSHVza", "DEBE3DCx7buH79Fg",
    "DEBE3DpyzOi4c3Rw", "DEBE3DkgtSxjD0Xl", "DEBE3DMNkGpb9aZG", "DEBE3DUsZwyarl9P", "DEBE3DkrkEogyarF", "DEBE3DusZPsbcS8s",
    "DEBE00YYTi0000C2", "DEBE3DayioPtWSTA", "DEBE3DBjkQ81hT0f", "DEBE3DEwgsloOu25", "DEBE3DDE5ITWxCmq", "DEBE3DRnvNgy0ibG",
    "DEBE3DpY7u7K223j", "DEBE3DIJ24c60eLz", "DEBE3DZq0HqXRym3", "DEBE3DjOhV5nRPzT", "DEBE3DzEnaohAVzF", "DEBE3DfSHgBAAftm",
    "DEBE3DQgSoFkvG7L", "DEBE3DBNHOVzVsb2", "DEBE3DaEZh3985Oe", "DEBE3DgzKJxIffBV", "DEBE3DMxiYueLH8X", "DEBE3DQtFJhQ5npV",
    "DEBE3DfckGB5NcuV", "DEBE00YYTi0000Bx", "DEBE3DacDvbIgZPx", "DEBE3DvrzDgV1Lrc", "DEBE00YYTi0000Bw", "DEBE3DQoad7uC6lp",
    "DEBE3DTI9elDVJHU", "DEBE3DL4qRx8oGCn", "DEBE3Ds8v5EOhsyE", "DEBE3DSCIXvqIY3Z", "DEBE3DOPCx4EuxYK", "DEBE3DYmMYXaomfk",
    "DEBE3DGXJHEPpGSY", "DEBE3DIy7uww4nv5",
    # M4 builder H: the Brandenburg Gate's attic (a raised roof: the gate is a figure), the hall roofs hanging over
    # Alexanderplatz's (18.7-27.1 m over a 6.7 m body) and the Zoo's (20.8-25 m over 8.7) viaducts: vaults in [[structures]]
    "DEBE01YYK0001xqy", "DEBE01YYK0001z5U", "DEBE3DEWbuSeLh2K", "DEBE3DLPnzPapVrB",
    # M10 fix round (builder R): the Neue Nationalgalerie's hall and its roof plate's four overhang canopies (a beige
    # hollow box at 4.6-10.4 m): a figure instead (scripts/m10f_structures.py)
    "DEBE3DLm1PkVj2Jm", "DEBE3DEBkBdyKstJ", "DEBE3DLKmQ9RPq9S", "DEBE3DI7scFRyFLk", "DEBE3DLI05H49nju"], osm = ["w304987174", "w304987173", "w304987172", "w304987176",
    "w131446868", "w131446864", "w131446870", "w131446862",
    "w120866116",           # the Weltkugelbrunnen (a fountain, 280 m² at 10.5 m)
    "w373626464", "w373626454", "w373626455", "w373626460", "w373626461",   # the Oberbaumbrücke's tower in the Spree (18 m; the bridge is M4's)
    "w303035499",
    # M4 builder H: figures in [[structures]] (scripts/m4h_structures.py) instead of OSM's stacks
    "w556435241", "w718035022"] }         # the Watergate club's floating terrace by the Oberbaumbrücke (102 m², all in the Spree: M3c's critic took the box for the bridge's tower standing in the river)
    # (and the Siegessäule's four upper 0.36 m plinth steps: floored at 3.5 m they stacked into one plinth four times)
osm_fix = { w96880477 = 368.0 }
# the Rotes Rathaus: the LoD2's tower solid (196 m², 83.7 m: its laser caught the spire's foot) at its 74 m parapet; the
# top to 94 m is M4's. (Its OSM parts no longer build it: the tower part lay beside the LoD2's tower, a 30 m² sliver
# from 30 to 74 m, and the building at 30 m)
# M4 (builder T): the HKW's auditorium under its shell roof (the [[structures]] figure) at 11 m, not the Umweltatlas's
# 21.6 (the shell's top, recheck's placeholder fix)
fix_h.gml_id.DEBE3DcKC9RSinNW = 11.0
# M4 builder H: towers whose laser caught a dome's or spire's foot, cut to the eave the [[structures]] figure
# stands on: the Gendarmenmarkt's domed towers, St. Hedwig's rotunda, the Bode-Museum's dome drum, Hackescher Markt's
# hall body; the Marienkirche (to 44 m: its 48 m helm, WP), Nikolaikirche, Zionskirche and Heilandskirche towers
fix_h.gml_id.DEBE3DgmfpurHZfT = 74.0
fix_h.gml_id.DEBE3DkEireAqk2H = 50.0
fix_h.gml_id.DEBE3DZe5I3ioLoM = 51.2
fix_h.gml_id.DEBE01YYK00000AQ = 19.5
fix_h.gml_id.DEBE3DfDgUjMn2VJ = 28.3
fix_h.gml_id.DEBE01YYK00004lV = 6.9
fix_h.gml_id.DEBE3Dm03ICrhanR = 44.0
fix_h.gml_id.DEBE3DJ5QoacFhgE = 38.1
fix_h.gml_id.DEBE3Dj5UEZckkkC = 44.8
fix_h.gml_id.DEBE3DyvAFdwloz7 = 45.3
# Fix round (critic 1): the LoD2's roofType 9999 solids (generalised: one flat top per complex) and its placeholder
# heights. 1,449 pieces at 5 m or less where the Umweltatlas (the same footprints, its own 2022 heights) is over twice
# as high (1,339 of them roofType 9999 at ~3-3.5 m: the Abgeordnetenhaus 3.5 m for 27, the Littenstraße courts 25.8,
# the Moabit court 24.9) take the Umweltatlas's; 9999 solids over 8 m off it too (the BND 13.1 for 33.3, the Park
# Center 23.6 for 34.3, the Dom's body 43.4 for 33.7), a lower one only where it is closer to geschosse x 3.4 m
recheck = { of = "lod2", source = "umwelt", low = 5.0, ratio = 2.0, field = "rooftype", values = ["9999"], diff = 8.0, storeys = "geschosse", storey_h = 3.4 }
# every LoD2 solid stands on its own ground (ground_z) to its own top: never on a canopy's or a twin solid's roof (the
# stacking lifted the Hauptbahnhof's piece to 53.9-105.5 m, the Paul-Löbe-Haus's parts to 51-55)
own_ground = true
# a tower's own parts the Umweltatlas measures at the tower's height are no copies (Heidestraße's 69 m, the
# Kudamm-Karree's 91-93, Zoofenster's)
copied_keep = ["umwelt"]
copied_storeys = "geschosse"    # (where the Umweltatlas has none: the Kudamm-Karree's 48 m² piece at 92.9 m, 22 storeys)
# M4 (builder T): the generalised solids recheck gave one Umweltatlas height over low wings (the BND's 41,809 m² at 33.3
# m over features from 5.4 m, the Park Center's mall, the Haupttelegrafenamt): split by the Umweltatlas's footprints
# clipped to them, each at its own height
gen_split = { of = "lod2", source = "umwelt", field = "rooftype", values = ["9999"], min_area = 1500.0, min_range = 6.0, min_piece = 20.0, skip = [
    "DEBE01YYK0002MCN", "DEBE01YYK000000D"] }    # (the Reichstag and the Berliner Dom: builder H's figures stand on
# their bodies; split, the Dom's 85 m landmark height went onto a 38 m² piece and its dome stood at 84-130 m)
# sloped canopies drawn from eave to ridge as boxes 4-24 m thick over nothing (the Sony Center's tent, the HKW's shell,
# the Zoo's aviaries: 105 pieces of 150 m² or more over 3 m thick): a 0.6 m slab at the top over open ground; a hall
# roof over a lower body (station halls 12 m over their concourse, the Hauptbahnhof's Bügel) reaches down to it
canopy_fit = { thick_max = 3.0, thick = 0.6, cover = 0.3, gap = 1.0, slab_max_area = 3000.0, max_down = 18.0 }   # (the Hauptbahnhof's vaults stay;
# the Treptow Twin Towers' roof between them 41 m over the podium stays up)
# no OSM height over the LoD2's laser: the preset's osm_height reconcile raised only the Nikolaikirche's and the
# Zionskirche's naves to their spires (84 and 67 m for 33 and 28)
reconcile = { sources = [] }
# OSM's fill on the water (Kulturschiff Paula, pontoons, a 154 m² piece in the Spree): boats at 3.5 m, not 10.5
afloat = { areas = ["natural=water"], share = 0.5, h = 3.5, tag = "ship" }
volume_dedupe = true        # the LoD2 has 665 pairs of solids overlapping by over 10 % (canopies over buildings)
dedupe_keep_taller = true   # 1,021 LoD2 solids lie 90 % inside another; where taller (two in three: a tower or a raised
                            # canopy over its building) they stay, volume_dedupe cutting them out of the lower one
# the preset's list and allotment huts, garden sheds and cabins: the LoD2 (the cadastre) has every real building
# but the Kleingärten's Lauben; OSM adds them where the LoD2 has nothing (M1: 315 allotment huts and 112 roofs)
osm_skip = ["roof", "carport", "ship", "boat", "houseboat", "shelter", "bridge", "construction", "container",
    "static_caravan", "subway_entrance", "entrance", "grandstand", "demolished", "abandoned", "ruins", "tent",
    "hut", "shed", "allotment_house", "cabin", "garden_house", "gazebo",
    # stations and viaducts OSM has where the LoD2 has nothing: over track or street (the Ostbahnhof's 18,600 m² platform
    # hall at 10.5 m, Ostkreuz's 6,190 m², Kottbusser Tor's elevated U1 station on the square, the S-Bahn's viaducts at
    # 3.5 m): decks and halls for M3/M4, not blocks from the ground
    "train_station", "viaduct"]
# What of the LoD2 is a building (first match wins; decision table in checks/buildings.md). ALKIS functions:
# 31001_* buildings; 51009_1610 Überdachung (canopy), _1611 Carport, _1750 Gedenkstätte/Denkmal (the Holocaust
# memorial's 2,711 stelae, the Soviet memorial's terrace, the listed Stadtbahn viaduct's arches at 7-9 m), 51001
# towers, 51002 chimneys and cranes, 51006_1430 stands, _1440 stadiums (the pitches at 0-2 m)
rules = [
    { label = "memorials and statues under 50 m² (the stelae)", field = "function", values = ["51009_1750"], area_below = 50, action = "exact" },
    { label = "flat structures under 2.5 m (terraces, pitches, crane rails)", field = "function", prefix = ["51", "53"], h_below = 2.5, action = "drop" },
    { label = "canopies under 20 m² (balcony roofs, porches)", field = "function", values = ["51009_1610", "51009_1611"], area_below = 20, action = "drop" },
    { label = "canopies and hall roofs (as their roof)", field = "function", values = ["51009_1610", "51009_1611"], action = "roof", thick = 0.6 },
    { label = "walled memorial grounds under 5 m (the Sophienkirchhof's 5,500 m² at 3 m)", field = "function", values = ["51009_1750"], area_from = 200, h_below = 5.0, action = "drop" },
    { label = "structures (viaducts, stands, towers, chimneys, cranes)", field = "function", prefix = ["51", "53"], action = "exact" },
    { label = "buildings under 2 m (underground garages' and basements' roofs)", field = "function", prefix = ["31001"], h_below = 2.0, action = "drop" },
    { label = "building parts (bays, stair towers, wings)", field = "part", values = ["true"], area_from = 1.0, action = "keep" },
    # the Umweltatlas (fill) has the same footprints, the LoD2's canopies and structures among them: none of those
    # fills a gap the rules above leave
    { source = "umwelt", label = "Umweltatlas structures and canopies", field = "funktion", prefix = ["51", "53"], action = "drop" },
    { source = "umwelt", label = "Umweltatlas footprints under 2 m", h_below = 2.0, action = "drop" },
    # M4 builder H: the Fernsehturm, the Siegessäule (figures in [[structures]]) and Ostkreuz's Ringbahn hall (a 6,324 m²
    # block to 24 m: a vault in [[structures]]), which the Umweltatlas fills once their OSM outlines are left out
    { source = "umwelt", label = "Umweltatlas pieces under M4 figures", field = "gml_id", values = ["DEBE01YYK0000B8a", "DEBE01YYK0002POy", "DEBE00YY2ps00009"], action = "drop" },
]

[buildings.landmarks]
match = "best"
radius = 40.0
cap = true
cap_keeps_lift = true       # (a capped part lifted over the ground keeps its base: the Fernsehturm's mast)
raise_parts = 5.0           # a tower drawn by OSM parts more than 5 m under its listed height: its parts scaled up

[buildings.kinds.field_kind]    # the ALKIS function (the LoD2's, every solid) -> the preset's kinds
field = "function"
[buildings.kinds.field_kind.map]
"31001_3041" = "civic"      # Kirche
"31001_3040" = "civic"      # Gebäude für religiöse Zwecke
