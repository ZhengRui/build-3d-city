# pits in the DGM1 (checks/sources.md §7: 182 under 30 m NHN in the ground area; no real dry ground in central
# Berlin is under ~31 m): the Tiergarten tunnel's ramp south of Potsdamer Platz (15.3 m), a 6.0 m hole at Westend,
# building pits and basements. Every dry pit with a cell under 29 m NHN re-filled from its outline as far as it
# lies 2 m under the ground's closing over 150 m (London's [terrain] pits); the rail and A100 cuttings (33-38 m
# NHN at their floor) seed none and stay
# (M3 fix round) pits holding 50 m or more of a motorway or railway at ground level are cuttings and troughs, left as
# the DGM1 has them (the A100's trough at Sonnenallee had been filled 11 m up, a pit at 52.527, 13.279 24 m)
pits = { below = 29.0, grow = 2.0, window = 150.0, keep_ways = ["motorway", "motorway_link", "rail", "light_rail", "subway"], keep_len = 50.0 }
# the Jakob-Kaiser-Haus's sunken courts east of the Reichstag (the DGM1 at 30 m NHN, 4.7 m under Dorotheenstraße: the
# critic's "sunken rectangular pit with walls"), over its basement's outline: re-filled from the street round it
# ... and a 1.8 ha hump of the DGM1 inside the Hauptbahnhof (to 9.8 m in the scene over Europaplatz's 4.5: the station's
# floor kept as ground), which lifted the Stadtbahn 5 m through the hall (its decks count from the highest ground
# within 80 m): re-filled from the streets round it, so the tracks run level through the station at ~11 m
patches = [[[13.377567, 52.518328], [13.377545, 52.518451], [13.378136, 52.518491], [13.378195, 52.518167], [13.378529, 52.51819], [13.378469, 52.518514], [13.37882, 52.518538], [13.378879, 52.518214], [13.379266, 52.518241], [13.379212, 52.518806], [13.379472, 52.518844], [13.379508, 52.518644], [13.379846, 52.518668], [13.379815, 52.518837], [13.380175, 52.518861], [13.380276, 52.518178], [13.380371, 52.518131], [13.377444, 52.517949], [13.377443, 52.518116], [13.377705, 52.518133], [13.377669, 52.518335], [13.377567, 52.518328]], [[13.3682, 52.5241], [13.3707, 52.5241], [13.3707, 52.5259], [13.3682, 52.5259], [13.3682, 52.5241]]]
# (M7) the DGM1's 81 tiles leave the ground area's four corners bare (8 % of the work grid), which the nearest-cell
# fill drew as stretched-column streaks (checks/terrain.png): filled from GLO-30 instead, opened 150 m (its roofs and
# woods), offset to the DGM1 along the edge and easing into the two's median difference over 600 m
gap_fill = { open = 150.0, smooth = 60.0, edge = 150.0, blend = 600.0 }
# (M7) the Ringbahn's and the A100's cuttings past the roads' 1 km margin (no tracks or carriageways drawn in them) read
# as smeared soft bands across the overview's foreground (M3 critic 2): filled to grade from their outlines
