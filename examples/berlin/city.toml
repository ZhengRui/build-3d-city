# >>> m8 lamps (builder M8)
# 06e_lamps: Berlin's official street lighting inventory (gdi.berlin.de WFS beleuchtung, dl-de/zero-2.0; raw/lamps/
# README.txt): 113,828 points in the box, EPSG:25833, no height, colour or flux per lamp, so those come by fixture type.
# Gas (6 % in the area: Kreuzberg, Tiergarten, Hansaviertel; region_research.md lights) a dim green-gold mantle;
# electric: LED <= 3,000 K is the standard for new lamps (25-35 % converted [believed]), the rest older white
# fluorescent and, on a share of the main roads' bracket lamps, high-pressure sodium.
[lamps]
path = "lamps/beleuchtung_bbox.geojson"
label = "Land Berlin, Öffentliche Beleuchtung (gdi.berlin.de, dl-de/zero-2.0)"
crs = "EPSG:25833"
kind_match = "contains"
skip_status = ["Ausser Betrieb", "zeitw. Demontiert", "Sanierung (außer"]
clip = 1500                 # the box reaches 6-10 km past the area: lamps there cost ~24 ms by night at the overview
fields = { kind = "leuchtentyp", status = "status", street = "strasse" }
[lamps.kinds]
"Gas-Aufsatz" = { h = 4.2, gas = true, flux = 1100 }          # the Modell-/Schinkelleuchte on a 4 m cast post, 4-6 mantles
"Gas-Hänge" = { h = 5.5, gas = true, flux = 1900 }            # the Reihenleuchte hanging from a bracket, 6-9 mantles
"Gas-Reihen" = { h = 5.5, gas = true, flux = 1900 }            # Reihenleuchte (outside the area)
"Gas-Sonder" = { h = 4.8, gas = true, flux = 1500 }           # candelabra, Bündelpfeiler
