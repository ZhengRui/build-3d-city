[markings]
# M5: German markings (RMS, StVO; data/region_research.md §1.1, §1.6). Lane, centre and edge lines, their dash table
# and widths are the viewer's (web/city.json markings: white, 3 m strokes every 9 m, 0.12 m). Here what OSM decides:
# - junction arms: OSM's 3,070 traffic-signal nodes make a signalled junction (a stop line and the pedestrian Furt's
#   two broken lines); elsewhere a give-way line on the lesser road (city.json draws it as Haifischzähne), none on the
#   greater or between equal side streets (right before left in the Tempo 30 zones)
junctions = "signals"
# - zebras only where OSM maps one (Berlin crosses on lights: ~250 zebras against 3,584 signalled crossings): plain
#   0.5 m bars, no zig-zags, no beacons; signal crossings between junctions with their Furt lines and stop lines
#   (zigzag 1 m: just the room for the stop lines either side, city.json zebra.zigzags false)
zebras = true
beacons = false
zigzag = 1.0
signal_crossings = true
# - bus lanes (OSM busway / lanes:bus / bus:lanes; 74 ways tagged) with a 0.25 m solid line, a third red-surfaced;
#   cycle lanes (Radfahrstreifen, OSM cycleway=lane) along the kerbs, solid, red-surfaced (city.json cycleLane)
bus_lanes = true
bus_red = 0.3
cycle_lanes = true
# - Kopfsteinpflaster: 18 % of the residential ways and 46 % of the living streets are surface=sett (granite setts)
setts = ["sett", "cobblestone", "unhewn_cobblestone"]
# - the Berliner Gehweg (AV Geh- und Radwege 2023): a mosaic-sett strip each side of the slab walkway (granite slabs
#   in the Altbau streets, 35 cm concrete plates elsewhere) on most side streets, fewer on the main roads (style 1:
#   city.json markings.sidewalk.style2); the rest plain slabs
# (M5 fix round: more on the Altbau main streets: Oranienstrasse's was plain slabs)
sidewalk_style = { primary = 0.5, secondary = 0.8, tertiary = 0.8, residential = 0.85, unclassified = 0.6, living_street = 0.5 }
# - tram tracks (OSM railway=tram, 96 km in the area: Torstraße, Invalidenstraße, Alexanderplatz, Warschauer Straße,
#   the Hauptbahnhof): grooved rails in the asphalt, a fifth in granite setts (Pflastergleis), grass or ballast beds
#   off the road
trams = { setts = 0.2, road_w = 2.4, off_w = 3.4 }
# - Unter den Linden's Mittelpromenade (M5 fix round): the space between the two carriageways one water-bound gravel
#   walk with granite edging (sidewalk style 2, city.json markings.sidewalk.promenade), not two slab sidewalks
promenades = ["Unter den Linden"]
sidewalk_style_names = ["Oranienstraße", "Adalbertstraße", "Kastanienallee", "Bergmannstraße"]   # the Gehweg end to end
[markings.sidewalk_w]       # Berlin pavements (AV guide values; region research 1.3: Altbau streets 4-5.5 m with the
                            # Unterstreifen's trees; class I 5 m), not europe-west's Paris widths
trunk = 4.0
primary = 5.0
secondary = 4.5
tertiary = 4.5
residential = 4.5
unclassified = 3.5
living_street = 3.0

# M6: the Baumkataster (Land Berlin, Baumbestand Berlin, dl-de/zero-2.0; raw/trees/README.txt) stands for the street
# and park trees in the districts: scripts/m6_trees.py writes trees_street.csv (107,650 round the boundary) and
# trees_park.csv (124,542) in the data folder. Rail land and stations take none (London's rule: no landuse=railway
# trees between the Stadtbahn's tracks); heights in half metres (park oaks and beeches reach 25-35 m); crowns
# capped short of the facades (Berlin's Altbau streets are 22-30 m wide between facades, the limes' crowns 8-12 m)
# and at the census's own crown diameter; the census's park trees stand on the ground (lift_flag: only trees on
# the drawn street surface take city.json's streetLift); none under the U1 viaduct's or the bridges' decks
[trees]
none_extra = ["landuse=railway", "railway=platform", "public_transport=station"]
height_q = 2
clip_walls = { gap = 0.6, min = 2.5 }
lift_flag = true
census_off_decks = true
[trees.green]
"tourism=zoo" = "forest"    # the Zoo's grounds are densely wooded; its enclosures (landuse=grass, smaller) stay open
[trees.street]
# invented street trees only outside the districts (the census inside): limes first (region_research.md §3.6:
# 72 trees per km of street, the nearest neighbour 8.9 m, 1.8-2.3 m in from the kerb)
step = 8.9
row_offset = 2.0
planted = { major = 0.6, minor = 0.55 }
height = { broadleaf = { major = [10, 19], minor = [7, 15] }, palm = [11, 16], flowering = [7, 10] }
[trees.street.census]
lon = "lon"
lat = "lat"
species = "genus"
height_field = "height"
crown_field = "crown"
height = [12.0, 0.0, 3.0, 38.0]  # (no trunk size used: 1-5 % of heights unknown take their group's median)
jitter = 0.06                    # heights are whole metres
species_bits = 3
# the viewer's eight Berlin species (city.json trees.species), by genus; a genus takes the first group naming it.
# Street trees in the districts (region_research.md §3.2): lime 41.9 %, maple 16.3, plane 8.6, oak 4.6, horse
# chestnut 3.5; park trees: maple 29 %, lime 12, oak 12, hornbeam 5, beech 5, robinia 4.5, poplar 3.9
groups = [
    ["lime", ["Tilia"]],                                        # Linde: tall, dense, heart-shaped leaves, yellowing
    ["maple", ["Acer", "Liquidambar"]],                         # Ahorn (Spitz-, Berg-), yellow to orange in October
    ["plane", ["Platanus"]],                                    # Platane: London's plane model (opt-in keys)
    ["oak", ["Quercus"]],                                       # Eiche: the Tiergarten's 24 %
    ["chestnut", ["Aesculus"]],                                 # Rosskastanie, leaf-miner brown by October
    ["robinia", ["Robinia", "Gleditsia", "Styphnolobium", "Sophora", "Ailanthus", "Gymnocladus"]],   # pinnate, light
    ["birch", ["Betula"]],                                      # Birke: white bark, small yellowing leaves
    ["broadleaf", []],      # the rest: hornbeam, beech, poplar, hazel, elm, ash, willow, hawthorn, pear, the few conifers ...
]
# green areas holding >= 10 listed trees a hectare (the parks: Treptower Park 61, Volkspark Friedrichshain 132,
# Hasenheide 91) have only those; the woods (OSM natural=wood: 103 ha of the Tiergarten's 180, where the census
# holds ~70 a hectare, a dense wood ~150) keep the invented forest between them; no invented tree in the 3 x 3
# cells round a listed one
# (M6 fix round: the woods keep their invented trees wherever no listed tree stands within 15 m, keep_woods: the
# Baumkataster lists the south-east Tiergarten's woods only in part, which stood as a bare lawn)
cover = { per_ha = 10, cells = 1, classes = ["park", "orchard", "scrub", "grass"], keep_woods = 15 }
# (trees_extra.csv: scripts/m6_trees.py --rows, Unter den Linden's four lime rows where the census leaves them out)
sources = [{ file = "trees_street.csv", street = true }, { file = "trees_park.csv", dedupe = 1.0 },
           { file = "trees_extra.csv", street = true, dedupe = 1.0 }]

# M6: Berlin's traffic (data/region_research.md §2): the Verkehrsmengenkarte 2023's heavy share (2.5 %), the fleet
# (KBA, LABO): cars ~70 % of the motor vehicles (SUVs 13 %), vans 12 %, taxis 4 % (6,552 licensed, hellelfenbein
# RAL 1015 by law), BVG buses 4 % on the corridors, motorbikes 2 %. Right-hand traffic (city.toml drive); OSM draws
# the dual carriageways (Karl-Marx-Allee, Unter den Linden, Leipziger Straße, Straße des 17. Juni) as two one-way
# ways: each keeps to its share of the gap (twin_limits). Buses only on OSM's bus routes (route=bus relations):
# BVG yellow (RAL 1023), solo and articulated MAN Lion's City, the ADL Enviro500 double-deckers on the 100, 200,
# 300 and the M-/X-lines that use them. Yellow Flexity trams on OSM's tram tracks (Mitte, Friedrichshain, Moabit;
# Kreuzberg has none): 30.8 m trains of four modules, one every ~700 m on each track (a tram every 5-10 minutes
# at ~20 km/h)
[cars]
deck_ends = true            # a lane meeting a bridge deck takes the deck's height at their node, not the ground's (quay walls read the river bed there)
types = [
    ["sedan", 4.25, 1.79, 1.46, "hatch"],        # Golf, Polo, Octavia, A-Class, 1-Series, Corsa, Model 3
    ["suv", 4.45, 1.84, 1.65, "crossover"],      # Tiguan, T-Roc, Q3, Model Y, Kuga
    ["taxi", 4.93, 1.85, 1.47, "taxi"],          # E-Class T-Modell, Octavia, Prius+: hellelfenbein, the yellow TAXI sign
    ["van", 5.0, 1.95, 1.95],                    # Transporter, Sprinter, Crafter
    ["bus", 12.0, 2.55, 3.1],                    # MAN Lion's City 12, eCitaro: BVG yellow, pale roof
    ["truck", 8.0, 2.5, 3.3],                    # rigid delivery trucks, BSR refuse trucks
    ["lorry", 12.0, 2.55, 3.8],
    ["moto", 1.95, 0.72, 1.2],
    ["bus_art", 18.1, 2.55, 3.1, "bus_art"],     # MAN Lion's City 18 G: the articulated workhorse of the M-lines
    ["bus_dd", 13.0, 2.55, 4.1, "bus_london"],   # ADL Enviro500 (199 double-deckers): the 100, 200, 300, M-/X-lines
    ["tram", 8.4, 2.4, 3.4, "tram_cab"],         # Flexity Berlin, 2.40 m wide: the front cab module
    ["tram_mid", 6.6, 2.4, 3.4, "tram_mid"],
    ["tram_tail", 8.4, 2.4, 3.4, "tram_tail"],   # the rear cab, facing back
]
twin_limits = true
kerb_occupancy = 0.62       # Altbau streets parked bumper to bumper (Parkraumbewirtschaftung zones), broken by driveways and bays
# (M6 fix round: one file per kerb with 15-25 % of the slots empty, and OSM's lane and street-side parking strips
# (Planckstrasse's, Am Weidendamm's) parked as one file along the strip, not filled as car parks)
kerb_occupancy_max = 0.82
street_side_lots = "row"
stop_clear = 2.5           # queues behind the stop line and the Furt of every signalled arm
park_pitch = [5.5, 6.0]
# sedan, suv, taxi, van, bus, truck, lorry, moto (bus_art, bus_dd and the trams: none parked)
parked_mix = [60, 15, 1, 12, 0, 0.5, 0, 2]
restricted_mix = [10, 4, 30, 14, 14, 0, 0, 6]
[cars.kerbside]             # region_research.md §2.5, calibrated on OSM's parking tags
primary = 0.08
secondary = 0.18
tertiary = 0.35
residential = 0.6
unclassified = 0.4
living_street = 0.3
road = 0.35
service = 0.12
[cars.class]                # speed m/s, mean gap m, queue factor, mix [sedan, suv, taxi, van, bus, truck, lorry, moto]
motorway = [20, 36, 0.8, [50, 16, 2, 14, 0, 7, 6, 1.5]]
trunk = [13, 34, 0.5, [55, 14, 3, 13, 2, 4, 1, 2]]
primary = [11, 32, 0.5, [55, 13, 4, 12, 6, 2.5, 0.3, 2]]     # (buses only where routes run: [cars.bus_routes])
secondary = [10, 34, 0.5, [57, 13, 4, 12, 4, 2.5, 0, 2]]
tertiary = [8, 42, 0.45, [58, 13, 3, 13, 3, 2.5, 0, 2]]
residential = [7, 60, 0.4, [60, 14, 2, 14, 0, 2, 0, 2]]
unclassified = [7, 70, 0.4, [60, 14, 2, 14, 0, 2, 0, 2]]
living_street = [4, 120, 0.5, [60, 14, 1, 16, 0, 0, 0, 2]]
road = [7, 70, 0.4, [60, 14, 2, 14, 0, 2, 0, 2]]
service = [5, 140, 0.5, [58, 13, 2, 22, 0, 1, 0, 2]]
[cars.bus_routes]
min = 3.0                   # a mix weight: residential streets on a route get buses too
split = { bus = 0.45, bus_art = 0.55 }
dd = "bus_dd"
networks = ["Verkehrsverbund Berlin-Brandenburg"]   # BVG and the VBB, not the Flixbus coaches
skip = ["N"]                # the night lines (N1-N97): no buses at 4 pm on streets only they take
dd_refs = ["100", "200", "300", "M19", "M29", "M41", "M46", "M48", "M85", "X9", "X34", "X10", "TXL"]
dd_share = 0.5
[cars.trams]
modules = ["tram_tail", "tram_mid", "tram_mid", "tram"]
gap = 0.25
speed = 6.5
spacing = 700.0
# colours (region_research.md §2.4: KBA new cars 2025 grey/silver 32 %, black 27, white 19, blue 10, red 5,
