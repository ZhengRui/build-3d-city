# Neuilly-sur-Seine: 275 m either side of Avenue Charles-de-Gaulle (the N13, bearing 116°, 1.9 km from the
# Pont de Neuilly to the Porte Maillot), so the Axe historique from the Arc de Triomphe to the Grande Arche has
# buildings all the way; the clip runs past both ends and the commune's own boundary trims it
"Neuilly-sur-Seine (Axe historique)" = { relation = 85802, clip = [[2.2548, 48.8892], [2.2846, 48.8797], [2.2814, 48.8752], [2.2516, 48.8847], [2.2548, 48.8892]] }

[sun]                       # 10 October, leaves still green (the viewer works its sun out from city.json's sun.date)
latitude = 48.86
declination = -6.8

[sources]
# official footprints first (M1, checks/report.md): APUR's Emprise bâtie in the 20 arrondissements (one polygon per
# building part, heights measured from its surface model), IGN's BD TOPO in La Défense and Neuilly (APUR's
# Paris layer stops at the Périphérique; its metropolitan layer merges the towers with the dalle there). OSM
# fills what they lack and gives the towers and monuments their building:parts
footprints = ["apur", "bdtopo", "osm"]
# APUR's measured heights where it is the footprint; BD TOPO's own in La Défense and Neuilly, and BD TOPO's under
# any other footprint it covers (OSM's fill in Paris, the few APUR parts without a height); OSM's tags after
# (height on 0-2 % of Paris's buildings, levels on ~60 %). Why this order: checks/report.md §8
heights = ["landmark", "apur", "bdtopo", "osm_height", "osm_levels", "default"]
dem = "ign"                 # bare earth: IGN LiDAR HD MNT (1 m), its voids and pits filled from RGE ALTI 5 m
backdrop = "ign"            # RGE ALTI at 25 m out to 36 km: bare earth in the same datum (NGF-IGN69), no step at the edge

[sources.apur]              # APUR Emprise bâtie Paris (ODbL; "Source : Apur, DGFiP, Ville de Paris (STDF), Orthophotoplans (Aerodata)")
adapter = "file"
path = "footprints/apur/emprise_batie_paris.geojson"
# opendata.apur.org's Hub download API (the service behind it, carto2.apur.org, resets TLS from China)
url = "https://opendata.apur.org/api/download/v1/items/85fa0a4303744ad4ab6e2a89882b5fca/geojson?layers=0"
label = "APUR"
districts = ["Paris 1er", "Paris 2e", "Paris 3e", "Paris 4e", "Paris 5e", "Paris 6e", "Paris 7e", "Paris 8e",
    "Paris 9e", "Paris 10e", "Paris 11e", "Paris 12e", "Paris 13e", "Paris 14e", "Paris 15e", "Paris 16e",
    "Paris 17e", "Paris 18e", "Paris 19e", "Paris 20e"]
# heights above ground from APUR's surface model less its terrain model, over the footprint: the median for
# ordinary buildings (it matches BD TOPO's hauteur to 0.04 m), the maximum for high-rise parts (b_igh, the
# IGH flag) over 60 m, where the median reads a stepped tower's lower wings (Tours Duo 83 m for 180). Not the
# maximum on every part over 60 m: on 43 ordinary parts it is a crane, a chimney or a spire; nor on an IGH part
# whose median is under 0.4 of its maximum (M2): a podium with a tower's edge in it (the Tribunal's 8,965 m²
# base, median 30 m, maximum 98 m) or a low piece beside one (39 m² at 3.6 m median, 95 m maximum). Every IGH
# tower's median is 0.45 of its maximum or more (Duo 1: 83 of 185)
height = "where((b_igh == 'O') & (h_max >= 60) & (h_med >= 0.4 * h_max), h_max, h_med)"
# (M2: c_perconst, the construction period, 98 % filled; c_tissu, the urban fabric (HBM, IGH, ER remarkable, TPE
# small-scale, TI industrial...); b_dalle, courtyard covers: the building kinds, region_research.md §5.3)
keep = ["n_sq_eb", "an_const", "c_perconst", "c_tissu", "b_dalle", "c_forme_toit", "c_toiture_mat", "b_terrasse", "b_igh",
    "c_morpho", "h_med", "h_max"]
rename = { al_med_mnt = "ground_elevation" }    # the ground's altitude (m NGF), for 03_compare's check against the DEM
# the Eiffel Tower is a [[structures]] figure (M4), not a building: APUR draws it as 8 stacked and footing parts
# (1889, high-rise flag; 41-321 m at the centre, the four pillars' feet 33-38 m)
drop = { n_sq_eb = [750072856, 750131110, 750102857, 750118957, 750100068, 750006810, 750011556, 750040628] }

[sources.bdtopo]            # IGN BD TOPO v3, layer batiment (Licence Ouverte Etalab 2.0; "Source : IGN, BD TOPO")
adapter = "file"
# from the Géoplateforme WFS (BDTOPO_V3:batiment, EPSG:2154, 1 km cells, paged; raw/footprints/README.txt)
# (+ M2: the strip south of La Défense's first box, 48.8818-48.8856 N, fetched the same way for the widened clip's
# Puteaux notch: Tour France)
path = ["footprints/bdtopo/bdtopo_v3_batiment_paris_defense_neuilly.gpkg", "footprints/bdtopo/bdtopo_v3_batiment_defense_south.gpkg"]
layer = "batiment"
label = "BD TOPO"
districts = ["La Défense (Puteaux)", "La Défense (Courbevoie)", "La Défense (Nanterre)", "Neuilly-sur-Seine (Axe historique)"]
height = "hauteur"          # m above the ground (one per building); exact on La Défense's towers (First 228.9)
keep = ["cleabs", "nature", "usage_1", "construction_legere", "nombre_d_etages", "date_d_apparition", "etat_de_l_objet"]
rename = { altitude_minimale_sol = "ground_elevation" }
# its use, nature and light-construction flag and date onto APUR's footprints in Paris too (the building kinds:
# churches, monuments, industrial buildings, annexes; a year where APUR has none)
lend = ["usage_1", "nature", "construction_legere", "date_d_apparition"]
# planned and ruined buildings; the Eiffel Tower's four nested outlines ("Tour, donjon", 42-286 m)
drop = { etat_de_l_objet = ["En projet", "En ruine"], cleabs = ["BATIMENT0000000000162158", "BATIMENT0000000000162159", "BATIMENT0000000000162160", "BATIMENT0000000000162699"] }

[sources.ign]               # IGN (Licence Ouverte Etalab 2.0): raw rasters from the Géoplateforme WMS-Raster (raw/dem/README.txt)
ground = "dem/ground/paris_ground_mnt_lidarhd_1m_l93.tif"
fill = "dem/ground/paris_ground_rgealti_5m_l93.tif"
backdrop = "dem/backdrop/paris_backdrop_rgealti_25m_l93.tif"

[buildings]
parts = true                # ~7.2k building:part outlines in Paris (the Louvre, Notre-Dame, the Invalides; La Défense's towers)
# the Eiffel Tower is a [[structures]] figure (M4), not a building: OSM draws it as its 330 m outline (way 5013364,
# building=tower) and stacked building:parts (the platforms, piers and roofs, the 1st floor's pavilions, the
# pillars' feet), all solid prisms. APUR's and BD TOPO's own parts of it are dropped in [sources.*] drop
exclude = { osm = ["w5013364", "w1462597762", "w308021389", "w308687753", "w308687752", "w308687748", "w308687745",
    "w308687744", "w1462597765", "w1462597764", "w1462597763", "r4114842", "r4114839", "w308689164", "w308689165",
    "w308689166", "w308689167", "w308145239", "w308145258", "w308145259", "w69034135", "w69034180", "w69034179",
    "w69034127",
    "w229301758"] }         # Hyatt Regency Étoile: a 0 m² part at 137-174 m (the hotel is 137 m)
# wrong OSM height tags (M2; landmarks_paris.csv): the Hyatt's outline 174 (137); Tour Duo 2 tagged like Duo 1 (180
# for 122); Notre-Dame's two 73 m parts on its 69 m towers
osm_fix = { r3074643 = 137.0, w942459281 = 122.0, w201611273 = 69.0, w201611274 = 69.0 }
# La Défense's dalle (and the Front de Seine's, the Olympiades'): BD TOPO's and APUR's heights count from the old
# ground under the slab, the terrain carries the slab: lower a building by the difference where it is over 5 m
# (a slope under a footprint gives 1-3 m); see 04_buildings slab_base and checks/buildings.md
slab_drop = 5.0
# BD TOPO's only (La Défense; Neuilly has no slab): APUR's ground altitude is its own terrain model, which already
# carries the slabs in Paris (median −0.13 m against the lidar); where it differs by 5+ m inside Paris it is noise
# on the hills and under big buildings (Belleville 30 m, Saint-Sulpice 5-7 m), not a slab. Tried on all sources
# in M2: 352 lowered and 47 dropped, many of them wrongly
slab_sources = ["bdtopo"]
# second opinions: OSM's height tag only (the preset's). NOT BD TOPO's (tried in M2): its polygons hold a building
# with its courtyard sheds and decks, which APUR draws apart, so it raised 1,159 APUR pieces by a median 21.6 m, 396
# of them under 50 m² (courtyard sheds to their building's roof) and the BnF's 46,800 m² esplanade deck from 0.1 m
# to 90 m. APUR's low readings on monuments (the Sacré-Cœur) are covered by their OSM parts

[ground]
town = true                 # the petite couronne beyond the districts: a painted roofscape, not bare paving
# M7: past the Périphérique the painted town read as "an empty beige plain ... like farmland", La Défense alone in a
# field. The petite couronne's OSM buildings (Overpass) raised as block masses (06e_masses) over the ground margin
# and 3 km on into the backdrop (buildings of 9 m and more), thinning out there so the town has no edge
masses = true
masses_reach = 3000.0
# the Seine steps down at its dams (Port-à-l'Anglais above Paris, Suresnes below: 26.7 m NGF through Paris, 23.4
# below), the Marne at Saint-Maurice, the canals at their locks (Canal Saint-Martin: 9 locks, 25 m): each pool
# is levelled on its own
pools = true
# French formal gardens: their allées and parterres are "stabilisé" (compacted gravel) round the mapped lawns and
# beds (OSM maps the lawns inside: 18-27 % of these gardens); the Champ de Mars is lawns, left green
gravel_parks = ["Jardin des Tuileries", "Jardin du Luxembourg", "Jardin du Palais Royal"]
# the parks' and the Bois' paths through the lawns (the Champ de Mars' and Tuileries' gravel allées are
# pedestrian areas; footpaths 2-3 m, the Bois' bridle paths 3 m); pedestrian areas (area=yes) are cut out whole
paths = { footway = 2.6, path = 2.0, cycleway = 2.6, bridleway = 3.0, steps = 2.5, pedestrian = 4.0 }
# M5: the squares and parvis cut out of the lawns (Notre-Dame's parvis read as bare brown soil and weedy lots):
# stone pedestrian areas (paving_stones, sett, concrete, untagged) and asphalt ones as layers of their own
paved = true
# M5 critic: saturated lawn strips along sidewalks where the street has none (Bd Saint-Germain, Quai de Conti): OSM
# grass slivers narrower than this left out
green_min_width = 3.5
# M5 critic: the Notre-Dame parvis a flat grey field: it is a multipolygon (r8726561), which the paths query missed
path_relations = true
[ground.green]
# no cemetery: Père-Lachaise, Montparnasse and Montmartre are stone tombs and paved alleys under trees, not
# lawn (their trees come from 08_trees' "landuse=cemetery" = "park"); flowerbeds are green
landuse = ["grass", "forest", "meadow", "farmland", "orchard", "recreation_ground", "village_green", "flowerbed"]

[roads]
lane_w = 3.2                # French city lanes are 3.0-3.25 m (CERTU), 3.5 m only on the big arterials and the Périphérique
footbridges = true          # the Pont des Arts, the Passerelles Senghor, Debilly and Simone-de-Beauvoir are footways
decks_ref = "water"         # the named decks below count from the water under them, level across the islands
decks_level = true          # ... from the water's level, not the lowest ground under the span (the quay walls drop the water cells beside the quays 6 m: the decks there stood 6 m low)
# The Seine's bridges: deck height over the water (the Paris pool at 3.55, below Suresnes 0.47; m). Paris's arch
# bridges run nearly level from quay to quay, their crowns about 0.8 m over the upper quays' lidar height at their
# ends (lower quartile of the deck ends from 05b's pins, + 0.8 m, less the water; scratch decks.py, 30 Sept), not
# the default 5 % ramps from both ends that humped them 2-4 m over the quays. Two-level crossings: the Métro 6
# viaduct 7 m over its boulevards (OSM's layer 2 made it 15) and 7 m over the road decks of the Pont de Bir-Hakeim
# and the Pont de Bercy where it crosses the river; line 5 onto the Viaduc d'Austerlitz; line 1 inside the Pont de
# Neuilly under its roadway; tram T3a on the Pont du Garigliano's deck; Métro 2 7.5 m over the Boulevards de la
# Chapelle and de la Villette, level over the Gare du Nord's and the Gare de l'Est's tracks (the grade line had it 11-14 m up)
decks = { "Pont Alexandre III" = 8.4, "Pont Charles de Gaulle" = 10.7, "Pont Louis-Philippe" = 8.9, "Pont Marie" = 10.6, "Pont Mirabeau" = 7.4, "Pont National" = 12.5, "Pont Nelson Mandela" = 10.8, "Pont Neuf" = 10.6, "Pont Notre-Dame" = 10.3, "Pont Royal" = 9.7, "Pont Saint-Louis" = 9.3, "Pont Saint-Michel" = 8.6, "Pont au Change" = 9.1, "Pont d'Arcole" = 8.6, "Pont d'Austerlitz" = 10.6, "Pont d'Issy" = 8.8, "Pont d'Iéna" = 9.7, "Pont de Bercy" = 9.0, "Pont de Bir Hakeim" = 9.5, "Pont de Charenton" = 9.7, "Pont de Courbevoie" = 12.0, "Pont de Grenelle" = 8.6, "Pont de Neuilly" = 11.7, "Pont de Puteaux" = 9.1, "Pont de Sully" = 8.7, "Pont de Suresnes" = 10.2, "Pont de Tolbiac" = 8.9, "Pont de l'Alma" = 8.4, "Pont de l'Archevêché" = 8.0, "Pont de la Concorde" = 8.8, "Pont de la Tournelle" = 9.6, "Pont des Invalides" = 8.0, "Pont du Carrousel" = 8.1, "Pont du Garigliano" = 14.8, "Pont du Maréchal-Juin" = 8.8, "Pont des Arts" = 8.0, "Passerelle Léopold-Sédar-Senghor" = 8.5, "Passerelle Debilly" = 8.0, "Métro 6" = { deck = 7.0, water = 16.5 }, "Métro 2" = { deck = 7.5, reach = 120.0 }, "Métro 5" = { deck = 7.5, water = 12.0 }, "Métro 1" = { deck = 7.5, water = 10.5 }, "Tram T3a" = { deck = 7.5, water = 14.3 } }
# Deck heights, Oct 2026 (after the outline decks followed their roads): with decks_level the spans stand at
# their values over the pool, not 6 m lower over the quay walls' foot (the Pont de Sully 6.2 m mid-river, 11.5 at its
# quays; the Pont Neuf, Austerlitz, Charles de Gaulle, Saint-Michel, Arcole, Carrousel, Issy the same). The Pont de
# l'Archevêché 6.6 -> 8.0 (it dipped 1.2 m under its left-bank end). The Pont de Puteaux crests over the Île de
# Puteaux (its roads meet it there at 15.8-16.0 m, the banks at 8.1-8.6, 120-130 m away): its spans lay level at
# 9.1 over the water 6 m under the island's roads and climbed 20 % to them; eased (below) they rise at 6.5 % to it.
# (left: the Pont de Neuilly's island roads meet it at 12.2, 14.2 and 12.2 m within 38 m, pinned: a 2 m bump there)
decks_ease = { "Pont de Puteaux" = 0.065 }
# M3 critic: the Pont d'Iéna drew as two 3.2 m bus lanes over open water (its carriageway is highway=service since the
# 2024 pedestrianisation, its pavements dropped as "along a road bridge"), and every bridge as a thin slab with no
# piers. Each named deck's OSM man_made=bridge outline is drawn whole as a slab (checks/bridges.md), with piers in
# the water: span -> [spans (arches), fascia depth m], from data/landmarks_paris.md's bridges table (stone arch
# bridges 2.5 m fascias, iron and steel ones less; single spans no piers)
bridge_outlines = true
# M4 critic: every bridge a thin flat slab on box piers. Each entry now also names its type (engine BRIDGE_TYPES:
# stone arches cut from the elevation, iron and concrete low segmental arches, girders with a flat soffit),
# with the arch's rise over its span where it isn't the type's: from data/landmarks_paris.md's bridges table and
# the reference photos (refs/pont-neuf, pont-alexandre-iii); [spans, crown depth m, type(, rise)] or a table
[roads.piers]               # span -> [spans, crown depth m, type(, rise)] or {spans, fascia, type, ...} (see above)
