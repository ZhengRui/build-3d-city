# (kerb-to-kerb widths of untagged ways: the europe-west preset's [roads.default_w], Paris's since M5/M6, checked
# against the facade-to-facade gaps there)

[markings]
dedupe = 0.6                # M3 critic: doubled lane dashes where OSM's carriageways overlap (Voie Georges-Pompidou, Avenue de New York)

[shores]
coast_type = "quay"         # (no coast inland: only banks and pools; kept for the record)
# the Seine's and the canals' banks are masonry quay walls (lower quays 2-3 m over the water; the wall is the
# lidar terrain's step): granite coping and a stone face, not the default concrete embankment
bank_type = "pondedge"
quay_walls = true           # the quays' walls ([terrain] quay_walls): limestone ashlar to the water, a sett apron on top
quay_face = 2.5             # M3 critic: small triangular spikes every 20-30 m along the walls (the TIN's quay cells, a
                            # staircase on the 5 m grid, peeking out of the wall face 1.5 m out): the face 2.5 m out
quay_apron = 5.0            # M3 critic: the 8 m aprons from both sides paved the Square du Vert-Galant's whole tip (5: the TIN's quay cell)
# M5 critic: the drop from the upper to the lower quay was a faceted TIN slope with grass wedges and saw-tooth edges;
# real quays are two flat stone terraces and a vertical dressed-stone wall 5-8 m high between them
step_walls = true
step_slope = 20.0           # the left bank's embankments by the Pont Neuf are 20-30 degree TIN slopes over 2-3 cells, not one
step_close = 6.0            # blocks under 12 m apart merged into one wall (the Quai de Conti drew as a row of separate blocks)

[terrain]
# M7: coloured by height (wooded from 25 m over the datum) the plateaus round Paris (40-180 m) were one dark forest;
# ESA WorldCover's land cover instead: the forests of Montmorency, Saint-Germain, Meudon and Sénart, the fields of the
# Plaine de France and Saclay, the towns between
backdrop_cover = "worldcover"
backdrop_town_rgb = [112, 110, 104]   # the ground between the towns' buildings from afar (asphalt, paving, gardens), close to the town layer's own mean
far_reach = 36000.0         # the backdrop: the Seine's valley, Mont Valérien, the Meudon and Saint-Cloud heights, the Plaine de France
# IGN lidar at 5 m kept sharp: the Seine's quay walls (lower quays 2-3 m over the water, upper quays 5-8 m more)
# are one grid cell wide, not a 50 m slope (the defaults' 10 m grid, 20 m TIN cells and 15 m smoothing)
work = 5.0
tin_cell = 5.0
smooth_bare = 2.5
tin_error = 2.0             # as New York's lidar (1.5: 714k ground triangles; 2.0: 566k)
tin_error_far = 4.0
tin_error_bank = 0.5        # within 40 m of the water: the lower quays (ports) stay a step, not a slope to the upper quay
tin_steps = 3.0             # M3 critic: rows of light spikes where the upper quay drops to the lower (Quai Branly, Conti) and
                            # along La Défense's Boulevard circulaire: every node on such a step kept, a clean one-cell ramp
# the water's banks are walls: nothing flattened round a levelled body (defaults 25 m flat, 90 m ramp)
water_flat = 0.0
water_ramp = 5.0
flat_spread = 3.0
water_all_touched = false   # on the 5 m grid the cell by a quay wall is the quay's: the road along it stays up
# Ground = metres over NGF-IGN69 minus this datum, so the lowest real ground is 0 (05a_terrain clamps what is lower).
# 23.4 m is the Seine's surface below the Suresnes barrage: the lidar's flat water reads 23.4-24.0 m from Croissy
# and Bougival to Saint-Ouen (its floor 23.4 m along 15 km of river; Paris's own pool above Suresnes reads 26.8-27.0).
# NOT the raw lowest cell (16.5 m at 48.8711, 2.1575: gravel pits at Croissy, Sartrouville and Gennevilliers, a
# few hectares of lidar returns below the water level, not ground anyone walks on)
datum = 23.4
# M3 critic: the banks read as sloping TIN embankments. Quay walls: the first land cells along levelled water
# take their quay's height and the water cells beside them drop 6 m, so the step sits in one TIN cell that
# 05e_shores covers with a vertical limestone wall at the water's outline and a flat apron ([shores] quay_walls)
quay_walls = true
