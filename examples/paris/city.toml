# Paris: the 20 arrondissements, La Défense and the Axe historique through Neuilly. Every city-specific setting
# of the build-3d-city pipeline; the engine (.agents/skills/build-3d-city/engine/pipeline, its README lists every
# key with its default) and the region preset "europe-west" hold the rest. Run a stage with
# `uv run city3d <stage>` from this folder, everything with `uv run city3d all`.

name = "paris"
title = "Paris"
preset = "europe-west"      # Western Europe's (its building kinds are Paris's since M2, facades and roofs since M4; rooftops Paris's since M6: chimney stacks and pots, Velux, lanterns; flat-roof plant)
utm_epsg = 32631            # UTM 31N (Paris is at 2.35 E, zone 31 spans 0-6 E); Lambert-93 (2154) is the French data's
coast = false               # inland: the Seine is a river 26 m above the sea, no coastline within 100 km
drive = "right"
# metres per storey for OSM building:levels (on ~60-70 % of Paris's buildings; height on 0-2 %, Phase 0): a
# Haussmann block is a 4-4.5 m ground floor and entresol, 3.2-3.5 m étages nobles and 2.8-3.0 m upper and
# mansard floors, about 20 m to the cornice and 23 m to the ridge for its 7 levels (R+6): 3.3 m on average
level_h = 3.3
user_agent = "3D-Fun paris reconstruction (hobby project)"
# overpass-api.de answered best for Paris during Phase 0 (30 Sept 2026; the others mostly timed out)
# Local Overpass first: the public servers were blocked/overloaded from this network on 30 Sept 2026 (and answer
# heavy queries with 429/504). 127.0.0.1:8799 is Docker container city3d-overpass, built from BBBike's Paris
# extract of 26 Sept 2026 (demos/data/overpass/README.txt); if it is down: `docker start city3d-overpass`.
overpass = ["http://127.0.0.1:8799/api/interpreter", "https://overpass-api.de/api/interpreter", "https://maps.mail.ru/osm/tools/overpass/api/interpreter",
    "https://overpass.kumi.systems/api/interpreter", "https://overpass.private.coffee/api/interpreter"]

