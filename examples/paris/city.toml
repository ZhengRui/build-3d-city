# M6 trees: the city's own inventories inside the districts, invented trees elsewhere (the Luxembourg and other
# state gardens the city doesn't list, the Bois' woods away from the drives, the 4 km margin). Ville de Paris
# "Les arbres" (ODbL, 220,215 trees: streets, gardens, cemeteries, schools, the Bois' drives; heights are class
# values, 9 % unknown) for the 20 arrondissements; for La Défense and Neuilly the Hauts-de-Seine département's
# road trees (genus, height) and its "cadastre vert" (Etalab 2.0; every crown seen from the air, its diameter,
# no species or height). Groups are the viewer's species (city.json trees.species), eight of them: 3 bits
[trees]
# M5 critic: the Concorde "sprinkled with trees", odd trees on the Notre-Dame parvis: no invented trees on the paved and
# asphalt squares (the inventory's own stay)
none_on_paved = true

[trees.street.census]
species_bits = 3
groups = [
    ["plane", ["Platanus"]],
    ["chestnut", ["Aesculus"]],
    ["lime", ["Tilia"]],
    ["sophora", ["Styphnolobium", "Sophora", "Robinia", "Gleditsia", "Gymnocladus", "Koelreuteria", "Ailanthus", "Toona", "Pterocarya", "Juglans", "Cladrastis", "Maackia"]],
    ["maple", ["Acer", "Liquidambar", "Parrotia"]],
    ["pine", ["Pinus", "Taxus", "Cedrus", "Chamaecyparis", "Cupressus", "Picea", "Abies", "Thuja", "Sequoiadendron", "Sequoia", "Metasequoia", "Taxodium", "Juniperus", "Larix", "Pseudotsuga", "Cryptomeria", "Cupressocyparis", "Calocedrus", "Araucaria", "Ginkgo"]],
    ["small", ["Prunus", "Pyrus", "Malus", "Cercis", "Magnolia", "Lagerstroemia", "Amelanchier", "Cornus", "Crataegus", "Corylus", "Ligustrum", "Sorbus", "Photinia", "Laburnum", "Albizia", "Ilex", "Arbutus", "Eriobotrya", "Mespilus", "Cotinus", "Syringa", "Hibiscus"]],
    ["broadleaf", []],      # the rest: hackberry, oak, ash, hornbeam, elm, poplar, beech, birch, tulip tree ...
]
# green areas in the districts with this many listed trees a hectare have only those (parks, cemeteries); the
# cells round each listed tree get no invented one
cover = { per_ha = 12, cells = 1 }
[[trees.street.census.sources]]   # Paris: every domanialité inside the 20 arrondissements (the Bois included)
file = "raw/trees/les-arbres.geojson"
districts = ["Paris 1er", "Paris 2e", "Paris 3e", "Paris 4e", "Paris 5e", "Paris 6e", "Paris 7e", "Paris 8e", "Paris 9e", "Paris 10e", "Paris 11e", "Paris 12e", "Paris 13e", "Paris 14e", "Paris 15e", "Paris 16e", "Paris 17e", "Paris 18e", "Paris 19e", "Paris 20e"]
species = "genre"
height_field = "hauteurenm"
dbh = "circonferenceencm"   # trunk circumference: a plane of 100 cm about 12 m, 130 cm 14 m, 225 cm 22 m
height = [3.0, 0.085, 3.0, 32.0]
jitter = 0.08               # heights are classes (5, 6, 8, 10 ... m)
[[trees.street.census.sources]]   # Hauts-de-Seine: trees on the departmental roads (genus, height)
file = "raw/trees/hauts-de-seine/voirie_dept.geojson"
districts = ["La Défense (Puteaux)", "La Défense (Courbevoie)", "La Défense (Nanterre)", "Neuilly-sur-Seine (Axe historique)"]
species = "genre"
height_field = "hauteur"
dbh = "circonference"
height = [3.0, 0.085, 3.0, 30.0]
jitter = 0.05
[[trees.street.census.sources]]   # ... and every other crown of the cadastre vert: height from its diameter
file = "raw/trees/hauts-de-seine/cadastre_vert_arbres.csv"
districts = ["La Défense (Puteaux)", "La Défense (Courbevoie)", "La Défense (Nanterre)", "Neuilly-sur-Seine (Axe historique)"]
sep = ";"
latlon = "geo_point_2d"
dbh = "diametre"            # crown diameter: 6 m about 9 m tall, 10 m about 13 m
height = [2.5, 1.05, 4.0, 24.0]
dedupe = 3.0                # the road trees are in it too

# camera presets for the viewer's menu (M3 on): areas and landmarks as in New York's city.toml. Areas:
# [lon, lat, distance m, elevation degrees(, azimuth looked from(, target's lift over the ground m))]; the
# afternoon sun (16:15 CEST in October) stands in the south-west, so most views look from the south-south-west
[blocks]                    # 07b_blocks: 2 km blocks, so the first view waits for less of the dense centre (M9)
size = 2000

[views]
[views.areas]
# the start view is city.json's startView (the Île de la Cité: the overview would wait for the whole city before it shows); the overview first in the menu
"Paris overview" = [2.3300, 48.8620, 12500, 34, 200]
"Île de la Cité and the Seine" = [2.3480, 48.8540, 1500, 26, 235]
"Louvre and Tuileries" = [2.3310, 48.8625, 1500, 28, 200]
"Place de la Concorde" = [2.32113, 48.86548, 480, 18, 200, 10]   # M10b: from over the Seine (south-south-west): the Luxor obelisk on the square, the Hôtel de la Marine and the Crillon, the Rue Royale to the Madeleine
"Champs-Élysées from the Arc" = [2.3045, 48.8702, 950, 10, 295, 20]   # from over the Arc (its top at 50 m) down the avenue to the Concorde
"Latin Quarter" = [2.3450, 48.8480, 1400, 28, 200]
"Marais" = [2.3600, 48.8590, 1300, 28, 200]
"Montparnasse" = [2.3220, 48.8425, 1500, 26, 200]
"Bercy and the BnF" = [2.3780, 48.8345, 1800, 26, 200]
"Belleville and the Buttes-Chaumont" = [2.3825, 48.8798, 1000, 22, 210]   # M10: the park's cliffs and lake with the Temple de la Sibylle, Belleville's hill behind
"La Défense (overview)" = [2.2395, 48.8920, 1700, 20, 140]
"Roofs of the 9e" = [2.3390, 48.8745, 380, 14, 215, 25]   # the "toits de Paris" (refs/area-zinc-roofs): ~115 m up over the zinc mansards east of the Opéra, looking north-east along them, chimney stacks in rows on the party walls
"Canal Saint-Martin (locks)" = [2.3650, 48.8735, 380, 16, 190, 0]   # M10: up the canal past the Récollets locks and the iron footbridges, from the south
"Avenue de l'Opéra (street level)" = [2.3325, 48.8688, 350, 3.0, 158, 20]   # on the avenue's axis (bearing 338) from the Palais-Royal end, ~40 m up, the Opéra at the end
"Boulevard Saint-Germain (street level)" = [2.34225, 48.85162, 250, 6, 290]   # M6: down the plane-lined boulevard (Odéon to Maubert, bearing 110) from ~30 m
"The Seine from the Pont des Arts" = [2.3420, 48.8568, 380, 1.0, 290, 5]   # near the water, the Vert-Galant's tip and the Pont Neuf ahead
"Eiffel Tower from the Trocadéro" = [2.294496, 48.858262, 750, 12, 315, 90]   # the tower is a structure from M4; the view is fixed from now
"Pont Alexandre III" = [2.31354, 48.86365, 190, 7, 262, 6]   # from downstream (west): the one low steel arch and the four pylons

[views.landmarks]
"Arc de Triomphe" = ["Arc de Triomphe", 115, 260, 6]      # from the Champs-Élysées (ESE) along the axis, the great arch open (M3 critic)
"Notre-Dame" = ["Cathédrale Notre-Dame de Paris", 250]       # the west front
"Sacré-Cœur" = ["Basilique du Sacré-Cœur", 190]
"Panthéon" = "Panthéon"
"Invalides dome" = ["Dôme des Invalides (église du Dôme)", 190]
"Opéra Garnier" = ["Opéra Garnier (Palais Garnier)", 160]
"Centre Pompidou" = ["Centre Pompidou", 250, 330, 18]     # from over the piazza: the west front's escalator tubes
"Musée d'Orsay" = ["Musée d'Orsay", 330, 480, 18]          # from across the Seine (the Tuileries' quay): the old station's front and clocks
"Grande Arche" = ["Grande Arche de La Défense", 290]         # from the Esplanade's side, through the arch

# the menu's groups: the city's areas, the three ground-level views, La Défense's towers together, then the
# landmarks with the Eiffel Tower among them (a first-time visitor finds the must-sees in one place)
[views.groups]
"Street and river" = ["Avenue de l'Opéra (street level)", "Boulevard Saint-Germain (street level)", "The Seine from the Pont des Arts", "Roofs of the 9e", "Canal Saint-Martin (locks)"]
"Landmarks" = ["Eiffel Tower from the Trocadéro", "Pont Alexandre III"]

# M8 night: the Ville de Paris public lighting inventory (ODbL; raw/lamps/README.txt): every open-air lamp at its
# place, height and colour temperature (06e_lamps); tunnels (SOUTERRAINS), galleries, floodlights, ground
# lights and RATP doors are left out. Default heights: candélabres 7 m (the most common support), wall consoles
# 5.5 m (4-6 m brackets on facades), arcade ceilings and wall lamps 3.5 m
[lamps]
path = "lamps/eclairage-public.geojson"
label = "Ville de Paris, Eclairage public (ODbL)"
skip_categories = ["SOUTERRAINS"]
kinds = { "Candélabre" = [7.0, 2.5, 16.0], "Console" = [5.5, 3.0, 12.0], "Mat" = [8.0, 3.0, 16.0], "Lanterne" = [4.5, 2.0, 10.0], "Applique" = [3.5, 2.0, 8.0], "Plafond" = [3.5, 2.0, 8.0], "Borne" = [1.0, 0.5, 2.0], "Portique" = [6.0, 3.0, 12.0] }
fields = { kind = "lib_ouvrag", category = "voie_categorie", height = "support_hauteur", kelvin = "lampe_temperature_couleur", family = "lampe_famille", power = "lampe_puissance", flux = "lampe_flux" }
